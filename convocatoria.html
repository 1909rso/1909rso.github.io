<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Editor de Convocatoria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@font-face{
  font-family:"Gulams Condensed";
  src:url("https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/fonts/Gulams-Condensed-BF69599692a9bc1.otf") format("opentype");
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"Pelinka Expanded Bold";
  src:url("https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/fonts/Pelinka-ExpandedBold.otf") format("opentype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"Steelfish Eb";
  src:url("https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/fonts/Steelfish%20Eb.otf") format("opentype");
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}
:root{
  --crest-top: 44px;
  --crest-right: 48px;
  --crest-size: 128px;
  --crest-max-size: 180px;
  --crest-gap: 20px;

  --title-top: 60px;
  --title-size: 230px;
  --title-color: #e0b570;
  --title-letter-spacing: 0px;

  --card-radius: 8px;
  --line-title-size: 30px;
  --line-title-spacing: 4px;
  --pname-size: 70px;
  --card-gap: 20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
body{
  margin:0;
  font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#111418;
  color:#eee;
  display:flex;
  min-height:100vh;
  min-height:100dvh;
}

#panel{
  width:360px;
  min-width:300px;
  background:#1a1e24;
  padding:18px;
  overflow-y:auto;
  height:100vh;
  height:100dvh;
  border-right:1px solid #2a2f37;
}
#downloadBtn{
  width:100%;
  padding:12px 10px;
  font-size:14px;
  margin-bottom:6px;
}
#downloadStatus{font-size:11px;color:#7a828d;min-height:14px;}
#panelToggle{
  display:none;
}
#panel h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:#8fb8ff;margin:22px 0 10px;}
#panel h2:first-child{margin-top:0;}
#panel label{display:block;font-size:12px;color:#aab2bd;margin:10px 0 4px;}
#panel select, #panel input[type=text], #panel input[type=number]{
  width:100%;padding:6px 8px;border-radius:6px;border:1px solid #333a44;
  background:#0f1216;color:#eee;font-size:13px;
}
#panel input[type=color]{
  width:100%;height:30px;padding:2px;border-radius:6px;border:1px solid #333a44;
  background:#0f1216;
}
.settings-group{color:#ffd479;font-size:12px;font-weight:700;text-transform:uppercase;margin:16px 0 4px;letter-spacing:.5px;}
.settings-row{display:flex;gap:8px;}
.settings-row > div{flex:1;}
.small{font-size:11px;color:#7a828d;}
button{
  cursor:pointer;border:none;border-radius:6px;padding:7px 10px;
  background:#2f6fed;color:#fff;font-size:12px;font-weight:600;
}
.player-row{
  display:flex;align-items:center;gap:6px;padding:5px 0;
  border-bottom:1px solid #23272e;font-size:12.5px;
}
.player-row span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#panel .player-row select{width:120px;flex:none;padding:3px 4px;font-size:11px;}
.player-row.extra{opacity:.8;}
.extra-label{font-size:10.5px;color:#ffd479;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 2px;}
.line-block{margin-bottom:8px;}
.line-block h3{font-size:12px;color:#ffd479;margin:12px 0 4px;text-transform:uppercase;}

#stage-wrap{
  flex:1;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:30px;
  overflow:auto;
}
#posterFrame{
  overflow:hidden;
  flex-shrink:0;
}
#posterScale{
  width:2000px;
  height:2500px;
  transform-origin:top left;
}
#poster{
  position:relative;
  width:2000px;
  height:2500px;
  background-size:cover;
  background-position:center;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}

@media (max-width:900px){
  body{flex-direction:column;}
  #panel{
    width:100%;
    min-width:0;
    height:auto;
    max-height:60vh;
    border-right:none;
    border-bottom:1px solid #2a2f37;
  }
  #panelToggle{
    display:block;
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background:#333a44;
  }
  #panel.collapsed > *:not(#panelToggle){display:none;}
  #panel.collapsed{max-height:none;}
  #stage-wrap{
    padding:14px;
    flex:none;
  }
}
#poster::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,0) 20%);
}

#tempOverlay{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
  background-size:cover;
  background-position:center;
}

#titleText{
  position:absolute;
  top:var(--title-top);
  left:0;right:0;
  text-align:center;
  font-family:"Gulams Condensed",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  font-size:var(--title-size);
  font-weight:normal;
  letter-spacing:var(--title-letter-spacing);
  color:var(--title-color);
  z-index:5;
  text-shadow:none;
}

#crests{
  position:absolute;
  top:var(--crest-top);
  right:var(--crest-right);
  display:flex;
  gap:var(--crest-gap);
  z-index:6;
}
#crests .crest-img{
  width:var(--crest-size);
  height:var(--crest-size);
  max-width:var(--crest-max-size);
  max-height:var(--crest-max-size);
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));
}

#lines{
  position:absolute;
  top:240px;left:0;right:0;bottom:40px;
  padding:0 60px;
  display:flex;
  flex-direction:column;
  z-index:4;
}
.line{
  margin-bottom:20px;
}
.line-title{
  color:#fff;
  font-family:"Pelinka Expanded Bold",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  font-weight:400;
  font-size:var(--line-title-size, 30px);
  letter-spacing:var(--line-title-spacing, 4px);
  text-transform:uppercase;
  margin-bottom:8px;
  text-shadow:0 1px 4px rgba(0,0,0,.6);
  text-align:center;
}
.line-divider{
  height:var(--divider-thickness, 4px);
  width:var(--divider-width, 100%);
  margin:0 auto 20px;
  background:rgba(255,255,255,.55);
}
.cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:var(--card-gap, 20px);
}
.card{
  position:relative;
  overflow:hidden;
  background:var(--card-bg, #ffffff);
  flex-shrink:0;
  width:var(--card-w,180px);
  height:var(--card-h,220px);
  border-radius:var(--card-radius);
  border:var(--card-border-w,4px) solid var(--card-border-c,#ffffff);
}
.card .photo{
  position:absolute;inset:0;
  width:100%;height:100%;
  background-size:cover;
  background-position:center;
  z-index:1;
  transform:translate(var(--photo-x, 0px), var(--photo-y, 0px)) scale(var(--photo-scale, 1));
  transform-origin:center;
}
.card{cursor:pointer;}
.card .gradient{
  position:absolute;inset:0;
  z-index:2;
  pointer-events:none;
}
.card .pname{
  position:absolute;
  left:0;right:0;bottom:8px;
  z-index:3;
  text-align:center;
  color:#fff;
  font-family:"Steelfish Eb",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  font-size:var(--pname-size, 21px);
  font-weight:400;
  line-height:1.1;
  padding:0 4px;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


/* iPhone / iPad */
@media (max-width:900px){
  html,body{
    width:100%;
    min-width:0;
  }

  body{
    display:block;
    overflow-x:hidden;
  }

  #panel{
    width:100%;
    max-height:60dvh;
    height:auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:14px;
  }

  #stage-wrap{
    width:100%;
    height:auto;
    min-height:0;
    padding:12px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  #posterFrame{
    margin:0 auto;
  }

  button,
  input,
  select{
    touch-action:manipulation;
  }
}

</style>

<link rel="preload" as="font" href="https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/fonts/Pelinka-ExpandedBold.otf" type="font/otf" crossorigin>
<link rel="preload" as="font" href="https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/fonts/Steelfish%20Eb.otf" type="font/otf" crossorigin>
</head>
<body>

<div id="panel">
  <button id="panelToggle">Ocultar editor ▲</button>
  <h2>Fondo</h2>
  <button id="bgToggleBtn" style="width:100%">Cambiar fondo (actual: 1)</button>
  <p class="small">Solo hay dos fondos (1.png y 2.png en la carpeta /convocatoria/fondo/). El botón alterna entre ambos.</p>

  <h2>Escudos</h2>
  <label>Equipo local</label>
  <input type="text" id="crestNameLocal" value="Real Sociedad">
  <label>Equipo visitante</label>
  <input type="text" id="crestNameVisitante" value="Real Sociedad">
  <p class="small">Tamaño, posición y máximo se ajustan solo en el CSS (:root, sección Escudos).</p>

  <h2>Jugadores</h2>
  <div id="playersList"></div>

  <h2>Descargar</h2>
  <button id="downloadBtn">📤 Compartir / guardar imagen</button>
  <div id="downloadStatus"></div>
</div>

<div id="stage-wrap">
  <div id="posterFrame">
   <div id="posterScale">
    <div id="poster">
      <div id="titleText">CONVOCATORIA</div>
      <div id="crests">
        <div id="crest1" class="crest-img" role="img" aria-label="escudo 1"></div>
        <div id="crest2" class="crest-img" role="img" aria-label="escudo 2"></div>
      </div>
      <div id="lines"></div>
      <div id="tempOverlay"></div>
    </div>
   </div>
  </div>
</div>

<script>
const LINES_CONFIG = [
  { key: "porteros",         title: "PORTEROS",         offsetTop: 140 },
  { key: "defensas",         title: "DEFENSAS",         offsetTop: 16 },
  { key: "centrocampistas",  title: "CENTROCAMPISTAS",  offsetTop: 16 },
  { key: "delanteros",       title: "DELANTEROS",       offsetTop: 16 }
];

const SQUAD = {
  porteros: ["Remiro", "Marrero"],
  defensas: ["Aramburu","Odriozola", "Fort", "Sarr", "Zubeldia", "Martin", "Pacheco", "Sergio", "Aihen"],
  centrocampistas: ["Herrera", "Turrientes", "Gorrotxa", "Soler","Zakharyan", "Sucic", "Marín"],
  delanteros: ["Kubo", "Guedes", "Ochieng", "Oyarzabal", "Oskarsson", "BARRENE"]
};

// Jugadores extra: no aparecen en el cartel por defecto (estado "hidden").
// Se pueden añadir varios por línea, no hay límite. Desde el menú
// (sección "Jugadores"), en el desplegable de cada uno de estos nombres,
// se elige "Normal" para incluirlo en la convocatoria o "No incluir"
// para quitarlo de nuevo. Igual que con los jugadores base, hace falta
// subir su foto a poses/1/ y poses/2/ con el nombre correspondiente.
const SQUAD_EXTRA = {
  porteros: ["Fraga", "Folgado", "Olasa"],
  defensas: ["Beitia", "Kita", "SUPLENTE3"],
  centrocampistas: ["Agirre", "Lebarbier"],
  delanteros: ["Diaz", "Carrera", "Marchal"]
};

const BG_BASE_URL = "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/convocatoria/fondo/";
function getBgUrl(n){
  return `${BG_BASE_URL}${n}.png`;
}

const CREST_BASE_URL = "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/escudos/BN/";
function getCrestUrl(name){
  if(!name) return CREST_FALLBACK;
  return `${CREST_BASE_URL}${encodeURIComponent(name)}.png`;
}
const CREST_FALLBACK = "https://placehold.co/120x120/1a1e24/ffffff?text=%3F";

// Aspecto de las tarjetas de jugador — editable temporalmente desde
// el menú (ver sección "Ajustes avanzados").
const CARD_CONFIG = {
  width: 190,
  height: 410,
  borderWidth: 2,
  borderColor: "#ffffff",
  radius: 2
};

// Línea divisoria bajo cada título de línea — editable temporalmente
// desde el menú.
// width: longitud de la línea (%). thickness: grosor en px.
const DIVIDER_CONFIG = {
  width: "23%",
  thickness: 5
};

function applyDividerVars(){
  const w = typeof DIVIDER_CONFIG.width === "number" ? DIVIDER_CONFIG.width + "px" : DIVIDER_CONFIG.width;
  document.documentElement.style.setProperty("--divider-width", w);
  document.documentElement.style.setProperty("--divider-thickness", DIVIDER_CONFIG.thickness + "px");
}

// Foto del jugador dentro de la tarjeta — editable temporalmente
// desde el menú. Se aplica igual a todas las tarjetas.
// scale: 1 = tamaño normal, 1.2 = 20% más grande, etc.
// offsetX / offsetY: desplazamiento en px (positivo = derecha/abajo).
const PHOTO_CONFIG = {
  scale: 1.4,
  offsetX: -5,
  offsetY: 100
};

function applyPhotoVars(){
  document.documentElement.style.setProperty("--photo-scale", PHOTO_CONFIG.scale);
  document.documentElement.style.setProperty("--photo-x", PHOTO_CONFIG.offsetX + "px");
  document.documentElement.style.setProperty("--photo-y", PHOTO_CONFIG.offsetY + "px");
}

// Capa de imagen TEMPORAL por delante de todo (mientras se termina
// de decidir el diseño final). Pon enabled:false para quitarla.
const TEMP_OVERLAY_CONFIG = {
  enabled: true,
  url: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/A479F0F0-2CE8-4DEE-8978-9A7B32673710.jpeg",
  opacity: 0
};

function applyTempOverlay(){
  const el = document.getElementById("tempOverlay");
  if(!TEMP_OVERLAY_CONFIG.enabled){
    el.style.display = "none";
    return;
  }
  el.style.display = "block";
  el.style.backgroundImage = `url("${TEMP_OVERLAY_CONFIG.url}")`;
  el.style.opacity = TEMP_OVERLAY_CONFIG.opacity;
}

// Degradado sobre la foto — editable temporalmente desde el menú
// (ver sección "Ajustes avanzados"). Siempre vertical.
const GRADIENT_CONFIG = {
  color: "#012476",
  opacity: 100,
  start: 0,
  end: 40
};

function stripAccents(str){
  return str.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function toPoseFileName(name){
  const clean = stripAccents(name.trim());
  return clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
}
const POSES_BASE_URL = "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/";
function getPlayerImgUrl(name){
  const fileName = toPoseFileName(name);
  return `${POSES_BASE_URL}${currentBg}/${encodeURIComponent(fileName)}.PNG`;
}

// --- Carga de imágenes de jugador -----------------------------------
// html2canvas (la librería que genera el PNG final) NO soporta la
// propiedad CSS "object-fit" en <img>, así que en la exportación la
// foto se estiraba para rellenar la tarjeta en vez de recortarse
// (esto era la "deformación"). Para evitarlo, la foto se pinta como
// fondo (background-image + background-size:cover) de un <div>, que
// sí se exporta igual que se ve en el lienzo.
//
// Por el mismo motivo, html2canvas tampoco soporta la propiedad CSS
// "filter" (el blanco y negro no se veía en la exportación). Para que
// el efecto B/N sea idéntico dentro y fuera, se convierte la imagen a
// gris de verdad (pixel a pixel) con un <canvas> oculto, en vez de
// aplicar un filtro CSS.
const imageLoadCache = new Map(); // url -> Promise<HTMLImageElement|null>
function loadImageEl(url){
  if(imageLoadCache.has(url)) return imageLoadCache.get(url);
  const p = new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.addEventListener("load", ()=>resolve(img), { once:true });
    img.addEventListener("error", ()=>resolve(null), { once:true });
    img.src = url;
  });
  imageLoadCache.set(url, p);
  return p;
}

const grayscaleUrlCache = new Map(); // url -> Promise<string|null>
function getGrayscaleUrl(url){
  if(grayscaleUrlCache.has(url)) return grayscaleUrlCache.get(url);
  const p = loadImageEl(url).then(img=>{
    if(!img) return null;
    try{
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth || 1;
      canvas.height = img.naturalHeight || 1;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = data.data;
      for(let i = 0; i < d.length; i += 4){
        const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
        d[i] = d[i+1] = d[i+2] = gray;
      }
      ctx.putImageData(data, 0, 0);
      return canvas.toDataURL("image/png");
    }catch(err){
      return null; // si falla (p.ej. CORS), se usa la foto en color
    }
  });
  grayscaleUrlCache.set(url, p);
  return p;
}

function applyPlayerPhoto(photoEl, name, state){
  const url = getPlayerImgUrl(name);
  if(state === "bw"){
    getGrayscaleUrl(url).then(grayUrl=>{
      photoEl.style.backgroundImage = `url("${grayUrl || url}")`;
    });
  }else{
    loadImageEl(url).then(img=>{
      if(!img){ photoEl.style.display = "none"; return; }
      photoEl.style.backgroundImage = `url("${url}")`;
    });
  }
}

let idCounter = 0;
const players = [];

LINES_CONFIG.forEach(line=>{
  (SQUAD[line.key] || []).forEach(name=>{
    players.push({ id: idCounter++, name, line: line.key, state: "normal", extra: false });
  });
  (SQUAD_EXTRA[line.key] || []).forEach(name=>{
    players.push({ id: idCounter++, name, line: line.key, state: "hidden", extra: true });
  });
});

const linesEl = document.getElementById("lines");
const playersListEl = document.getElementById("playersList");

function currentGradientCSS(){
  const color = GRADIENT_CONFIG.color;
  const opacity = GRADIENT_CONFIG.opacity / 100;
  const start = GRADIENT_CONFIG.start;
  const end = GRADIENT_CONFIG.end;
  const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
  const rgba = `rgba(${r},${g},${b},${opacity})`;
  const transparent = `rgba(${r},${g},${b},0)`;
  return `linear-gradient(to top, ${rgba} ${start}%, ${transparent} ${end}%)`;
}

function renderLines(){
  linesEl.innerHTML = "";
  LINES_CONFIG.forEach(lineCfg=>{
    const lineWrap = document.createElement("div");
    lineWrap.className = "line";
    lineWrap.style.marginTop = (lineCfg.offsetTop || 0) + "px";

    const title = document.createElement("div");
    title.className = "line-title";
    title.textContent = lineCfg.title;
    lineWrap.appendChild(title);

    const divider = document.createElement("div");
    divider.className = "line-divider";
    lineWrap.appendChild(divider);

    const cardsWrap = document.createElement("div");
    cardsWrap.className = "cards";

    players.filter(p=>p.line===lineCfg.key && p.state!=="hidden").forEach(p=>{
      const card = document.createElement("div");
      card.className = "card";
      card.addEventListener("click", ()=>{
        p.state = p.state === "bw" ? "normal" : "bw";
        renderLines();
        renderPlayerList();
      });

      const photo = document.createElement("div");
      photo.className = "photo";
      applyPlayerPhoto(photo, p.name, p.state);
      card.appendChild(photo);

      const grad = document.createElement("div");
      grad.className = "gradient";
      grad.style.background = currentGradientCSS();
      card.appendChild(grad);

      const name = document.createElement("div");
      name.className = "pname";
      name.textContent = p.name;
      card.appendChild(name);

      cardsWrap.appendChild(card);
    });

    lineWrap.appendChild(cardsWrap);
    linesEl.appendChild(lineWrap);
  });
  applyCardSizeVars();
  fitAllPlayerNames();
}

// Tamaño normal = --pname-size (el máximo). Si un nombre no cabe en el
// ancho de la tarjeta, se reduce solo el de ese nombre, poco a poco,
// hasta que cabe entero en una línea.
function fitAllPlayerNames(){
  const maxSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pname-size")) || 21;
  linesEl.querySelectorAll(".pname").forEach(el=>{
    let size = maxSize;
    el.style.fontSize = size + "px";
    while(el.scrollWidth > el.clientWidth && size > 10){
      size--;
      el.style.fontSize = size + "px";
    }
  });
}

function addPlayerRow(container, p){
  const row = document.createElement("div");
  row.className = "player-row" + (p.extra ? " extra" : "");

  const span = document.createElement("span");
  span.textContent = p.extra ? p.name + " (extra)" : p.name;
  row.appendChild(span);

  const select = document.createElement("select");
  ["normal","bw","hidden"].forEach(st=>{
    const opt = document.createElement("option");
    opt.value = st;
    opt.textContent = st==="normal" ? "Normal" : st==="bw" ? "Blanco y negro" : (p.extra ? "No incluir" : "Ocultar");
    if(st===p.state) opt.selected = true;
    select.appendChild(opt);
  });
  select.addEventListener("change", ()=>{
    p.state = select.value;
    renderLines();
  });
  row.appendChild(select);

  container.appendChild(row);
}

function renderPlayerList(){
  playersListEl.innerHTML = "";
  LINES_CONFIG.forEach(lineCfg=>{
    const block = document.createElement("div");
    block.className = "line-block";
    const h3 = document.createElement("h3");
    h3.textContent = lineCfg.title;
    block.appendChild(h3);

    const basePlayers = players.filter(p=>p.line===lineCfg.key && !p.extra);
    const extraPlayers = players.filter(p=>p.line===lineCfg.key && p.extra);

    basePlayers.forEach(p=>addPlayerRow(block, p));

    if(extraPlayers.length){
      const extraLabel = document.createElement("div");
      extraLabel.className = "extra-label";
      extraLabel.textContent = "Extra (opcionales)";
      block.appendChild(extraLabel);

      extraPlayers.forEach(p=>addPlayerRow(block, p));
    }

    playersListEl.appendChild(block);
  });
}

function applyCardSizeVars(){
  const w = CARD_CONFIG.width + "px";
  const h = CARD_CONFIG.height + "px";
  const bw = CARD_CONFIG.borderWidth + "px";
  const bc = CARD_CONFIG.borderColor;
  const br = CARD_CONFIG.radius + "px";
  document.querySelectorAll(".card").forEach(c=>{
    c.style.setProperty("--card-w", w);
    c.style.setProperty("--card-h", h);
    c.style.setProperty("--card-border-w", bw);
    c.style.setProperty("--card-border-c", bc);
    c.style.setProperty("--card-radius", br);
  });
}

let currentBg = 1;
const bgToggleBtn = document.getElementById("bgToggleBtn");
function applyBg(){
  document.getElementById("poster").style.backgroundImage = `url("${getBgUrl(currentBg)}")`;
  bgToggleBtn.textContent = `Cambiar fondo (actual: ${currentBg})`;
  document.documentElement.style.setProperty("--card-bg", currentBg === 2 ? "#161616" : "#00195F");
  GRADIENT_CONFIG.color = currentBg === 2 ? "#2e2e2e" : "#012476";
}
bgToggleBtn.addEventListener("click", ()=>{
  currentBg = currentBg === 1 ? 2 : 1;
  applyBg();
  renderLines();
});

function applyCrest(inputId, elId){
  const name = document.getElementById(inputId).value.trim();
  const el = document.getElementById(elId);
  const url = getCrestUrl(name);
  // Igual que las fotos de jugador: se pinta como fondo (background-image)
  // en vez de <img src> para que la exportación no estire el escudo fuera
  // de su proporción (object-fit tampoco lo soporta html2canvas).
  loadImageEl(url).then(img=>{
    el.style.backgroundImage = `url("${img ? url : CREST_FALLBACK}")`;
  });
}
document.getElementById("crestNameLocal").addEventListener("input", ()=>applyCrest("crestNameLocal","crest1"));
document.getElementById("crestNameVisitante").addEventListener("input", ()=>applyCrest("crestNameVisitante","crest2"));

const posterScale = document.getElementById("posterScale");
const posterFrame = document.getElementById("posterFrame");
const stageWrap = document.getElementById("stage-wrap");
const POSTER_W = 2000, POSTER_H = 2500;

function fitPoster(){
  const padding = window.innerWidth <= 900 ? 28 : 60;
  const availableW = stageWrap.clientWidth - padding;
  const availableH = window.innerHeight - (window.innerWidth<=900 ? 40 : 60);
  const scale = Math.min(1, availableW / POSTER_W, availableH / POSTER_H);
  posterScale.style.transform = `scale(${scale})`;
  posterFrame.style.width = (POSTER_W*scale) + "px";
  posterFrame.style.height = (POSTER_H*scale) + "px";
}
window.addEventListener("resize", fitPoster);
window.addEventListener("orientationchange", ()=>setTimeout(fitPoster,150));

const panel = document.getElementById("panel");
const panelToggle = document.getElementById("panelToggle");
panelToggle.addEventListener("click", ()=>{
  panel.classList.toggle("collapsed");
  panelToggle.textContent = panel.classList.contains("collapsed") ? "Mostrar editor ▼" : "Ocultar editor ▲";
  setTimeout(fitPoster,50);
});

const downloadBtn = document.getElementById("downloadBtn");
const downloadStatus = document.getElementById("downloadStatus");

function withTimeout(promise, ms, fallback=null){
  return Promise.race([
    promise,
    new Promise(resolve => setTimeout(() => resolve(fallback), ms))
  ]);
}

async function waitForFonts(){
  if(!document.fonts) return;

  // Las fuentes se definen como 400 porque cada archivo contiene una sola variante.
  // Esto evita que Safari/iOS intente resolver un peso inexistente.
  const loads = [
    document.fonts.load('400 230px "Gulams Condensed"', 'CONVOCATORIA'),
    document.fonts.load('400 30px "Pelinka Expanded Bold"', 'PORTEROS DEFENSAS CENTROCAMPISTAS DELANTEROS'),
    document.fonts.load('400 70px "Steelfish Eb"', 'MAIGNAN RESTES RISSER UPAMECANO')
  ];

  await withTimeout(Promise.allSettled(loads), 10000);
  await withTimeout(document.fonts.ready, 5000);
}

async function waitForImages(){
  // Escudos: ahora son fondos (background-image) de un <div>, igual que
  // las fotos de jugador; se espera su carga con el mismo helper.
  const crestLocal = getCrestUrl(document.getElementById("crestNameLocal").value.trim());
  const crestVisitante = getCrestUrl(document.getElementById("crestNameVisitante").value.trim());
  const crestPromises = [loadImageEl(crestLocal), loadImageEl(crestVisitante)];

  // Fotos de jugador (fondo del div .photo) y fondo del cartel: hay que
  // esperar a que el background-image (o su versión en gris) esté listo
  // antes de capturar, si no la tarjeta sale en blanco en la exportación.
  const photoPromises = players
    .filter(p => p.state !== "hidden")
    .map(p => {
      const url = getPlayerImgUrl(p.name);
      return p.state === "bw" ? getGrayscaleUrl(url) : loadImageEl(url);
    });

  const bgPromise = loadImageEl(getBgUrl(currentBg));

  await withTimeout(Promise.all([...crestPromises, ...photoPromises, bgPromise]), 15000);
}

async function waitForExportAssets(){
  await waitForFonts();
  await waitForImages();

  // Dejamos que Safari/iOS pinte la fuente antes de leer el DOM con html2canvas.
  await new Promise(resolve => requestAnimationFrame(() => resolve()));
  await new Promise(resolve => requestAnimationFrame(() => resolve()));
}

async function capturePoster(){
  const poster = document.getElementById('poster');
  const prevTransform = posterScale.style.transform;
  const prevFrameWidth = posterFrame.style.width;
  const prevFrameHeight = posterFrame.style.height;
  const prevFrameOverflow = posterFrame.style.overflow;
  const prevBoxShadow = poster.style.boxShadow;

  // La previsualización puede estar reducida, pero la exportación NO.
  posterScale.style.transform = 'none';
  posterFrame.style.width = POSTER_W + 'px';
  posterFrame.style.height = POSTER_H + 'px';
  posterFrame.style.overflow = 'visible';

  // La sombra alrededor del cartel es solo un adorno del editor (para que
  // "flote" sobre el fondo oscuro de la página); no forma parte del
  // diseño y sobresale del recuadro de 2000x2500, así que en la
  // exportación se quita para que no aparezca como un borde/efecto
  // extraño que no está en el lienzo.
  poster.style.boxShadow = 'none';

  try{
    await waitForExportAssets();

    const capturePromise = html2canvas(poster, {
      width: POSTER_W,
      height: POSTER_H,
      windowWidth: POSTER_W,
      windowHeight: POSTER_H,
      x: 0,
      y: 0,
      scrollX: 0,
      scrollY: 0,
      scale: 1,
      useCORS: true,
      allowTaint: false,
      backgroundColor: null,
      logging: false,
      imageTimeout: 8000,
      removeContainer: true,
      // La capa "temporal" (tempOverlay) solo debe salir en la exportación
      // si de verdad se ve en el lienzo (opacidad > 0). Si está a 0 se
      // excluye del todo de la captura, para que nunca pueda colarse como
      // un efecto/imagen añadida que no se ve en la previsualización.
      ignoreElements: (el) => {
        if(el && el.id === 'tempOverlay'){
          const opacity = parseFloat(getComputedStyle(el).opacity || '0');
          return opacity <= 0;
        }
        return false;
      }
    });

    // Evita que un recurso externo deje el botón bloqueado indefinidamente.
    const canvas = await withTimeout(capturePromise, 60000, null);

    if(!canvas){
      throw new Error('La exportación tardó demasiado.');
    }

    return canvas;
  }finally{
    posterScale.style.transform = prevTransform;
    posterFrame.style.width = prevFrameWidth;
    posterFrame.style.height = prevFrameHeight;
    posterFrame.style.overflow = prevFrameOverflow;
    poster.style.boxShadow = prevBoxShadow;
    fitPoster();
  }
}

function canvasToBlob(canvas){
  return new Promise((resolve, reject) => {
    try{
      canvas.toBlob(blob => {
        if(blob) resolve(blob);
        else reject(new Error('No se pudo crear el PNG.'));
      }, 'image/png');
    }catch(error){
      reject(error);
    }
  });
}

async function shareOrSaveOnIPhone(blob){
  const filename = 'convocatoria.png';
  const file = new File([blob], filename, {type:'image/png'});

  // Web Share API (hoja de compartir nativa, permite "Guardar imagen")
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      return {ok:true, cancelled:false, mode:'share'};
    } catch (shareErr) {
      if (shareErr.name === 'AbortError') return {ok:true, cancelled:true, mode:'share'}; // el usuario canceló
    }
  }

  // Fallback (desktop / navegadores sin Web Share con archivos):
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.download = filename;
  link.href = url;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);

  // En iOS sin soporte de share con files, abrir en pestaña nueva
  // para poder mantener pulsado y "Guardar imagen".
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
  if (isIOS) {
    window.open(url, '_blank');
  }

  return {ok:true, cancelled:false, mode:'fallback'};
}

downloadBtn.addEventListener('click', async () => {
  if(downloadBtn.disabled) return;

  downloadBtn.disabled = true;
  downloadStatus.textContent = 'Preparando imagen...';

  try{
    const canvas = await capturePoster();
    downloadStatus.textContent = 'Creando PNG...';

    const blob = await canvasToBlob(canvas);
    const result = await shareOrSaveOnIPhone(blob);

    if(result.cancelled){
      downloadStatus.textContent = 'Compartir cancelado.';
    }else if(result.mode === 'share'){
      downloadStatus.textContent = 'Se ha abierto el menú de compartir.';
    }else{
      downloadStatus.textContent = 'Imagen abierta. Puedes guardarla en Fotos.';
    }
  }catch(error){
    console.error(error);
    downloadStatus.textContent = 'No se pudo exportar. Vuelve a intentarlo.';
  }finally{
    downloadBtn.disabled = false;
  }
});

applyBg();
applyCrest("crestNameLocal","crest1");
applyCrest("crestNameVisitante","crest2");
applyDividerVars();
applyPhotoVars();
applyTempOverlay();
renderPlayerList();

(async ()=>{
  // Espera a que la tipografía de los nombres esté cargada antes de medir
  // y ajustar tamaños, para no calcularlo con una fuente de reserva
  // provisional. Si tarda demasiado o falla, se sigue igualmente.
  if(document.fonts){
    try{ await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  }
  renderLines();
  fitPoster();
})();
</script>
