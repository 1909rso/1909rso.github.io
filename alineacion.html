<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de Alineación</title>
<style>
  @font-face {
    font-family: 'LaLiga';
    src: url('https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/alineacion/escudo/LaLiga.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #1b1b1b;
    font-family: 'LaLiga', Arial, sans-serif;
    color: #fff;
  }

  #panel {
    max-width: 1728px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  #panel label {
    font-size: 16px;
  }

  #formacionSelector, #btnDescargar {
    font-family: 'LaLiga', Arial, sans-serif;
    font-size: 16px;
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  #btnDescargar {
    background: #0047ab;
    color: #fff;
  }

  #btnDescargar:hover {
    background: #003580;
  }

  #btnSubirCapa, #btnQuitarCapa {
    font-family: 'LaLiga', Arial, sans-serif;
    font-size: 16px;
    padding: 8px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    background: #444;
    color: #fff;
    display: inline-block;
  }

  #btnSubirCapa:hover, #btnQuitarCapa:hover {
    background: #666;
  }

  #contenedorCanvas {
    max-width: 1728px;
    margin: 0 auto;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: pointer;
  }

  /* Modal selector de jugador */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #overlay.activo {
    display: flex;
  }

  #modal {
    background: #14213d;
    border-radius: 10px;
    width: 420px;
    max-width: 90vw;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 2px solid #ffffff33;
  }

  #modalHeader {
    padding: 16px;
    border-bottom: 1px solid #ffffff33;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #modalHeader h3 {
    margin: 0;
    font-size: 18px;
  }

  #cerrarModal {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }

  #buscador {
    margin: 12px 16px;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    font-size: 16px;
    font-family: 'LaLiga', Arial, sans-serif;
  }

  #listaJugadores {
    overflow-y: auto;
    padding: 0 8px 12px 8px;
  }

  .item-jugador {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 8px;
    border-radius: 6px;
    cursor: pointer;
  }

  .item-jugador:hover {
    background: #ffffff22;
  }

  .item-jugador .num {
    width: 30px;
    text-align: center;
    font-weight: 700;
    opacity: 0.8;
  }

  .item-jugador .nom {
    flex: 1;
  }

  .item-jugador .rol {
    font-size: 12px;
    opacity: 0.6;
  }

  /* ===== TEMPORAL: mover escudos (borrar este CSS, su HTML y su JS al terminar) ===== */
  body { padding-bottom: 42vh; }
  #tmpMover {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    max-height: 40vh; overflow-y: auto;
    background: #14213dee; border-top: 2px solid #ffffff44;
    font-family: Arial, sans-serif; font-size: 14px;
  }
  #tmpMover summary { padding: 10px 14px; font-weight: 700; cursor: pointer; }
  #tmpMover .tmpFila { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 4px 14px; }
  #tmpMover button, #tmpMover select {
    font-size: 16px; padding: 8px 14px; border-radius: 6px; border: none;
    background: #0047ab; color: #fff; cursor: pointer;
  }
  #tmpMover button.flecha { background: #444; min-width: 46px; padding: 8px 0; }
  #tmpMover select { background: #444; }
  #tmpMover #tmpModo.activo { background: #d99a00; }
  #tmpSalida {
    display: block; width: calc(100% - 28px); margin: 8px 14px 12px; box-sizing: border-box;
    font-size: 11px; background: #0b1428; color: #fff;
    border: 1px solid #ffffff33; border-radius: 6px; padding: 6px;
  }
  canvas.tmpMoviendo {
    touch-action: none; cursor: move; outline: 4px dashed #ffcc00; outline-offset: -4px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* ===== FIN TEMPORAL ===== */
</style>
</head>
<body>

  <div id="panel">
    <label for="formacionSelector">Formación:</label>
    <select id="formacionSelector"></select>
    <button id="btnDescargar">Descargar imagen</button>
    <label id="btnSubirCapa" for="inputCapa">Añadir capa</label>
    <input type="file" id="inputCapa" accept="image/*" style="display:none;">
    <button id="btnQuitarCapa" style="display:none;">Quitar capa</button>
  </div>

  <div id="contenedorCanvas">
    <canvas id="canvas" width="1728" height="2160"></canvas>
    <p id="cargando" style="text-align:center;">Cargando imágenes...</p>
  </div>

  <div id="overlay">
    <div id="modal">
      <div id="modalHeader">
        <h3>Elegir jugador</h3>
        <button id="cerrarModal">&times;</button>
      </div>
      <input type="text" id="buscador" placeholder="Buscar jugador...">
      <div id="listaJugadores"></div>
    </div>
  </div>

  <!-- ===== TEMPORAL: mover escudos (borrar este bloque, su CSS y su JS al terminar) ===== -->
  <details id="tmpMover" open>
    <summary>Mover escudos (temporal)</summary>
    <div class="tmpFila">
      <button id="tmpModo">Modo mover: NO</button>
      <button id="tmpCopiar">Copiar posiciones</button>
      <span id="tmpEstado"></span>
    </div>
    <div class="tmpFila"><span id="tmpSel">Activa el modo mover y arrastra un escudo</span></div>
    <div class="tmpFila">
      <button class="flecha" data-mov="-1,0">◀</button>
      <button class="flecha" data-mov="0,-1">▲</button>
      <button class="flecha" data-mov="0,1">▼</button>
      <button class="flecha" data-mov="1,0">▶</button>
      <select id="tmpPaso">
        <option value="1">1 px</option>
        <option value="5" selected>5 px</option>
        <option value="10">10 px</option>
      </select>
      <button id="tmpReset">Restablecer formación</button>
    </div>
    <textarea id="tmpSalida" readonly rows="5"></textarea>
  </details>
  <!-- ===== FIN TEMPORAL ===== -->

<script>
  // ============================
  // DATOS FIJOS (editar solo una vez al año)
  // ============================
  const FONDO_URL = 'https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/alineacion/escudo/fondo.png';
  const ESCUDO_URL = 'https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/escudos/color/Real%20Sociedad.png';
  const COLOR_ESCUDO = '#0a2a6b'; // azul marino que sustituye al color original del escudo

  // Posición y tamaño de los textos sobre cada ficha.
  // dx/dy son desplazamientos en píxeles respecto a la esquina superior
  // izquierda del escudo (para número y texto) o respecto al centro,
  // debajo del escudo (para el nombre). Cambia estos valores para mover
  // o agrandar/achicar cada texto.
  //
  // El nombre además se puede curvar con "curvatura": grados que se dobla
  // el texto por cada 100 px de longitud. 0 = recto; positivo = los
  // extremos suben (forma de sonrisa, como el fondo del escudo); negativo
  // = los extremos bajan. Todos los nombres usan el mismo radio de curva.
  const TEXTO_CONFIG = {
    numero:  { dx: 15, dy: 120, tamano: 50 },
    texto:   { dx: 15, dy: 170, tamano: 16 },   // el texto pequeño (DEF/MED/DEL) bajo el número
    nombre:  { dx: 9,  dy: -84, tamano: 35, curvatura: 21 }    // sobre la parte baja del escudo, centrado y curvado
  };

  // Título de la imagen ("11 POSIBLE"), arriba a la izquierda.
  // x/y: esquina superior izquierda del texto (en píxeles del lienzo).
  // tamano: tamaño de letra. curvatura: igual que en el nombre (0 = recto).
  const TITULO_CONFIG = { texto: '11 POSIBLE', x: 129, y: 7, tamano: 216, curvatura: 0 };

  // Tamaño y borde de TODOS los escudos a la vez.
  // escala: 1 = tamaño normal, 1.2 = un 20% más grandes, 0.8 = un 20% más pequeños.
  // grosor: ancho en píxeles del contorno blanco alrededor del escudo.
  // Ambos afectan a las 11 fichas por igual.
  const ESCUDO_CONFIG = {
    escala: 1.35,
    grosor: 5
  };

  // Posición y tamaño de la FOTO dentro de cada escudo (aplica a las 11 fichas).
  // escala: 1 = ajustada al escudo, >1 la agranda (se recorta igualmente a la
  // forma del escudo), <1 la reduce. dx/dy la desplazan dentro del escudo.
  const FOTO_CONFIG = {
    escala: 1.05,
    dx:0,
    dy: 50
  };

  // Capa superior opcional (imagen subida desde el móvil), por encima de todo lo demás
  const CAPA_SUPERIOR_CONFIG = {
    opacidad: 0.3
  };

  // Degradado de color sobre cada escudo, entre la foto y los textos.
  // Tiene la misma forma que el escudo (no se sale de esa silueta).
  // Va en dos tramos, empezando desde abajo del escudo hacia arriba:
  //   1) "solido": se mantiene al 100% del color durante esta proporción
  //      de la altura del escudo (0 a 1). Ej: 0.3 = el 30% inferior sólido.
  //   2) "desvanecido": justo después del tramo sólido, baja del 100% al
  //      0% (transparente) a lo largo de esta otra proporción de la altura.
  // Si "desvanecido" es 0, el degradado corta en seco sin transición.
  // Si "solido" es 0, empieza a desvanecerse ya desde abajo del todo.
  const DEGRADADO_CONFIG = {
    color: '#071f52',   // azul un poco más oscuro que COLOR_ESCUDO (#0a2a6b)
    solido: 0.15,
    desvanecido: 0.3
  };

  function colorConAlpha(hex, alpha) {
    const limpio = hex.replace('#', '');
    const r = parseInt(limpio.substring(0, 2), 16);
    const g = parseInt(limpio.substring(2, 4), 16);
    const b = parseInt(limpio.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // Plantilla completa del equipo (todos los jugadores disponibles para elegir)
  const PLANTILLA = [
    { numero: 1,  nombre: "REMIRO",   texto: "POR", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Remiro.PNG" },
    { numero: 13, nombre: "MARÍN",  texto: "POR", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Marin.PNG" },
    { numero: 24, nombre: "AIHEN",    texto: "DEF", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Aihen.PNG" },
    { numero: 5,  nombre: "ZUBELDIA", texto: "DEF", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Zubeldia.PNG" },
    { numero: 4,  nombre: "ARETXABALETA", texto: "DEF", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Aretxabaleta.PNG" },
    { numero: 20, nombre: "PACHECO",  texto: "DEF", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Pacheco.PNG" },
    { numero: 3,  nombre: "GOROSABEL", texto: "DEF", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Gorosabel.PNG" },
    { numero: 15, nombre: "MUNOZ",    texto: "DEF", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Munoz.PNG" },
    { numero: 8,  nombre: "ZUBIMENDI", texto: "MED", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Zubimendi.PNG" },
    { numero: 6,  nombre: "MERINO",   texto: "MED", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Merino.PNG" },
    { numero: 10, nombre: "OYARZABAL", texto: "MED", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Oyarzabal.PNG" },
    { numero: 21, nombre: "SUCIC",    texto: "MED", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Sucic.PNG" },
    { numero: 14, nombre: "TURRIENTES", texto: "MED", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Turrientes.PNG" },
    { numero: 18, nombre: "GUEVARA",  texto: "MED", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Guevara.PNG" },
    { numero: 7,  nombre: "KUBO",     texto: "DEL", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Kubo.PNG" },
    { numero: 9,  nombre: "SADIQ",    texto: "DEL", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Sadiq.PNG" },
    { numero: 11, nombre: "SORLOTH",  texto: "DEL", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Sorloth.PNG" },
    { numero: 17, nombre: "BECKER",   texto: "DEL", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Becker.PNG" },
    { numero: 19, nombre: "OSKARSSON", texto: "DEL", imagen: "https://raw.githubusercontent.com/1909rso/1909rso.github.io/refs/heads/main/poses/1/Oskarsson.PNG" }
  ];

  // Once inicial: el primer jugador es siempre el portero.
  // Se puede cambiar cada jugador haciendo clic sobre su ficha.
  let ALINEACION = [
    PLANTILLA[1],  // POR — Marín
    PLANTILLA[2], PLANTILLA[3], PLANTILLA[4], PLANTILLA[5], // DEF
    PLANTILLA[8], PLANTILLA[9], PLANTILLA[10], // MED
    PLANTILLA[14], PLANTILLA[15], PLANTILLA[16] // DEL
  ];

  // Formaciones más usadas (estilo FIFA / EA FC), de defensa a ataque.
  // Cada array suma siempre 10 (los 10 jugadores de campo, sin contar portero).
  const FORMACIONES = {
    "4-3-3":     [4, 3, 3],
    "4-4-2":     [4, 4, 2],
    "4-2-3-1":   [4, 2, 3, 1],
    "4-1-4-1":   [4, 1, 4, 1],
    "4-3-1-2":   [4, 3, 1, 2],
    "4-1-2-1-2": [4, 1, 2, 1, 2],
    "3-5-2":     [3, 5, 2],
    "3-4-3":     [3, 4, 3],
    "3-4-1-2":   [3, 4, 1, 2],
    "5-3-2":     [5, 3, 2],
    "5-4-1":     [5, 4, 1],
    "4-5-1":     [4, 5, 1]
  };

  // Ajustes manuales de posición, por formación. Sirven para mover a mano
  // cualquiera de los 11 jugadores respecto a la posición que se calcula
  // automáticamente, sin tener que tocar el resto del código.
  //
  // El índice 0 es siempre el portero; los índices 1-10 son el resto de
  // jugadores en el mismo orden en que se reparten por formación (de
  // defensa a ataque, izquierda a derecha en cada línea).
  //
  // dx/dy son píxeles de desplazamiento (positivo = derecha/abajo,
  // negativo = izquierda/arriba). Si una formación no aparece aquí, o le
  // faltan jugadores, esos usan 0,0 (posición normal, sin ajustar).
  //
  // Ejemplo para mover al portero 20px a la derecha y 15px arriba en el 4-3-3:
  //   "4-3-3": [ { dx: 20, dy: -15 } ]
  const AJUSTES_POSICION = {
    "4-3-3":     [],
    "4-4-2":     [],
    "4-2-3-1":   [],
    "4-1-4-1":   [],
    "4-3-1-2":   [],
    "4-1-2-1-2": [],
    "3-5-2":     [],
    "3-4-3":     [],
    "3-4-1-2":   [],
    "5-3-2":     [],
    "5-4-1":     [],
    "4-5-1":     []
  };

  function obtenerAjuste(formacionKey, indice) {
    const lista = AJUSTES_POSICION[formacionKey];
    if (!lista || !lista[indice]) return { dx: 0, dy: 0 };
    return { dx: lista[indice].dx || 0, dy: lista[indice].dy || 0 };
  }

  // ============================
  // MOTOR DE DIBUJO (no editar)
  // ============================
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const CANVAS_W = canvas.width;
  const CANVAS_H = canvas.height;
  const HEADER_H = 380; // espacio reservado arriba para título/rival
  const FICHA_W_BASE = 240;
  let FICHA_W = FICHA_W_BASE;
  let FICHA_H = 300; // se recalcula tras cargar el escudo, para no deformar su forma

  let fondoImg = null;
  let escudoImg = null;
  let escudoSilueta = null; // canvas con el escudo recoloreado en azul marino (sirve de molde)
  let escudoContorno = null; // canvas con el escudo recoloreado en blanco (sirve de borde)
  let capaSuperiorImg = null; // imagen subida por el usuario, se pinta al final por encima de todo
  let hitboxes = []; // posiciones clicables de la última pintada: {x,y,w,h,slot}
  const cacheImagenes = {};
  let renderToken = 0; // evita que un dibujo antiguo se pinte encima de uno nuevo

  function crearSilueta(img, colorHex) {
    // Toma la forma (canal alfa) de la imagen y la rellena entera de un color sólido
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const cctx = c.getContext('2d');
    cctx.drawImage(img, 0, 0);
    cctx.globalCompositeOperation = 'source-in';
    cctx.fillStyle = colorHex;
    cctx.fillRect(0, 0, c.width, c.height);
    return c;
  }

  function cargarImagen(src, timeoutMs = 6000) {
    return new Promise((resolve) => {
      if (cacheImagenes[src]) return resolve(cacheImagenes[src]);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      let resuelto = false;
      const terminar = (valor) => {
        if (resuelto) return;
        resuelto = true;
        if (valor) cacheImagenes[src] = valor;
        resolve(valor);
      };
      img.onload = () => terminar(img);
      img.onerror = () => terminar(null);
      setTimeout(() => terminar(null), timeoutMs); // si no responde a tiempo, seguimos sin ella
      img.src = src;
    });
  }

  // Dibuja texto siguiendo un arco de circunferencia.
  // anclaje: 'centro' (x = centro del texto) o 'izquierda' (x = borde izquierdo).
  // curvatura: grados por cada 100 px de texto (0 = recto, + = sonrisa, - = al revés).
  // Usa la fuente y el color que ya estén puestos en ctx.
  function dibujarTextoCurvo(texto, x, y, curvatura, anclaje) {
    const total = ctx.measureText(texto).width;
    const cx = anclaje === 'izquierda' ? x + total / 2 : x;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';
    if (!curvatura) {
      ctx.fillText(texto, cx, y);
      return;
    }
    const k = (curvatura * Math.PI / 180) / 100; // radianes de giro por píxel de texto
    let prefijo = '';
    for (const ch of Array.from(texto)) {
      // posición del centro de la letra medida desde el centro del texto
      const s = ctx.measureText(prefijo).width + ctx.measureText(ch).width / 2 - total / 2;
      const ang = s * k;
      ctx.save();
      ctx.translate(cx + Math.sin(ang) / k, y - (1 - Math.cos(ang)) / k);
      ctx.rotate(-ang);
      ctx.fillText(ch, 0, 0);
      ctx.restore();
      prefijo += ch;
    }
  }

  function dibujarJugador(jugador, cx, cy, ancho, alto, img) {
    const g = ESCUDO_CONFIG.grosor;
    const tempW = ancho + g * 2;
    const tempH = alto + g * 2;
    const x = cx - tempW / 2;
    const y = cy - tempH / 2;

    const temp = document.createElement('canvas');
    temp.width = tempW;
    temp.height = tempH;
    const tctx = temp.getContext('2d');

    // 1) Contorno: la misma silueta (sin escalar) dibujada muchas veces desplazada
    //    en círculo alrededor del centro. Esto crea un borde uniforme de "g" px,
    //    en vez de estirar el escudo (que lo deformaba).
    if (escudoContorno) {
      const pasos = 24;
      for (let i = 0; i < pasos; i++) {
        const ang = (i / pasos) * Math.PI * 2;
        const dx = Math.cos(ang) * g;
        const dy = Math.sin(ang) * g;
        tctx.drawImage(escudoContorno, g + dx, g + dy, ancho, alto);
      }
    }

    // 2) Capa aparte: escudo azul marino con la foto ya recortada dentro, a tamaño normal
    const capa = document.createElement('canvas');
    capa.width = ancho;
    capa.height = alto;
    const cctx = capa.getContext('2d');
    if (escudoSilueta) cctx.drawImage(escudoSilueta, 0, 0, ancho, alto);
    if (img) {
      cctx.globalCompositeOperation = 'source-atop';
      const fw = ancho * FOTO_CONFIG.escala;
      const fh = alto * FOTO_CONFIG.escala;
      const fx = (ancho - fw) / 2 + FOTO_CONFIG.dx;
      const fy = (alto - fh) / 2 + FOTO_CONFIG.dy;
      cctx.drawImage(img, fx, fy, fw, fh);
      cctx.globalCompositeOperation = 'source-over';
    }

    // 2b) Degradado de color con la misma forma del escudo, entre la foto y los textos.
    //     Tramo sólido al 100% desde abajo, y luego se desvanece hasta 0%.
    const totalFraccion = Math.min(DEGRADADO_CONFIG.solido + DEGRADADO_CONFIG.desvanecido, 1);
    if (totalFraccion > 0) {
      const yInicio = alto; // abajo del escudo
      const yFin = alto - alto * totalFraccion; // hasta aquí llega el degradado
      const puntoFinSolido = totalFraccion > 0 ? DEGRADADO_CONFIG.solido / totalFraccion : 0;
      const gradiente = cctx.createLinearGradient(0, yInicio, 0, yFin);
      gradiente.addColorStop(0, colorConAlpha(DEGRADADO_CONFIG.color, 1));
      gradiente.addColorStop(Math.min(puntoFinSolido, 1), colorConAlpha(DEGRADADO_CONFIG.color, 1));
      gradiente.addColorStop(1, colorConAlpha(DEGRADADO_CONFIG.color, 0));
      cctx.globalCompositeOperation = 'source-atop';
      cctx.fillStyle = gradiente;
      cctx.fillRect(0, 0, ancho, alto);
      cctx.globalCompositeOperation = 'source-over';
    }

    // 3) Se superpone centrada sobre el contorno, dejando visible el borde blanco alrededor
    tctx.drawImage(capa, g, g);

    ctx.drawImage(temp, x, y);

    // Número (posición configurable en TEXTO_CONFIG.numero)
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ffffff';
    ctx.font = `700 ${TEXTO_CONFIG.numero.tamano}px LaLiga, Arial, sans-serif`;
    ctx.fillText(jugador.numero, x + g + TEXTO_CONFIG.numero.dx, y + g + TEXTO_CONFIG.numero.dy);

    // Texto pequeño bajo el número, ej. "DEF" (posición configurable en TEXTO_CONFIG.texto)
    ctx.font = `400 ${TEXTO_CONFIG.texto.tamano}px LaLiga, Arial, sans-serif`;
    ctx.fillText(jugador.texto, x + g + TEXTO_CONFIG.texto.dx, y + g + TEXTO_CONFIG.texto.dy);

    // Nombre, curvado sobre la parte baja del escudo (tamaño, posición y curvatura en TEXTO_CONFIG.nombre)
    const N = TEXTO_CONFIG.nombre;
    ctx.font = `700 ${N.tamano}px LaLiga, Arial, sans-serif`;
    ctx.fillStyle = '#ffffff';
    dibujarTextoCurvo(jugador.nombre.toUpperCase(), cx + N.dx, y + tempH + N.dy, N.curvatura, 'centro');
  }

  function calcularPosiciones(lineas) {
    const totalFilas = lineas.length + 1;
    const altoDisponible = CANVAS_H - HEADER_H - 60;
    const altoFila = altoDisponible / totalFilas;

    const posiciones = [];
    const yPortero = HEADER_H + altoDisponible - altoFila / 2;
    posiciones.push({ x: CANVAS_W / 2, y: yPortero });

    lineas.forEach((cantidad, idxLinea) => {
      // idxLinea=0 es la línea más defensiva (va justo encima del portero, abajo);
      // la última línea del array (delantera) queda arriba, cerca del título.
      const filaDesdeAbajo = idxLinea + 1;
      const y = HEADER_H + altoDisponible - altoFila * (filaDesdeAbajo + 0.5);
      const margen = 160;
      const anchoUtil = CANVAS_W - margen * 2;
      for (let i = 0; i < cantidad; i++) {
        const x = margen + (anchoUtil / (cantidad + 1)) * (i + 1);
        posiciones.push({ x, y });
      }
    });

    return posiciones;
  }

  async function precargarTodo() {
    // Carga el fondo, el escudo y todas las fotos de la plantilla una sola vez,
    // antes de dibujar nada. Así cambiar de formación o de jugador es instantáneo.
    fondoImg = await cargarImagen(FONDO_URL);
    escudoImg = await cargarImagen(ESCUDO_URL);
    if (escudoImg) {
      escudoSilueta = crearSilueta(escudoImg, COLOR_ESCUDO);
      escudoContorno = crearSilueta(escudoImg, '#ffffff');
      // Ajustamos el ancho según ESCUDO_CONFIG.escala y el alto según la
      // proporción real del escudo, para no deformarlo.
      FICHA_W = Math.round(FICHA_W_BASE * ESCUDO_CONFIG.escala);
      FICHA_H = Math.round(FICHA_W * (escudoImg.naturalHeight / escudoImg.naturalWidth));
    }
    await Promise.all(PLANTILLA.map(j => cargarImagen(j.imagen)));
  }

  async function dibujarAlineacion(formacionKey) {
    const miToken = ++renderToken; // identifica esta llamada
    const lineas = FORMACIONES[formacionKey];
    const posiciones = calcularPosiciones(lineas);

    // Como las imágenes ya están precargadas, esto es prácticamente instantáneo,
    // pero por seguridad seguimos comprobando el token tras cada await.
    const imagenes = await Promise.all(ALINEACION.map(j => cargarImagen(j.imagen)));
    if (miToken !== renderToken) return; // otra llamada más nueva ya está en curso: no pintar

    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    if (fondoImg) ctx.drawImage(fondoImg, 0, 0, CANVAS_W, CANVAS_H);

    ctx.fillStyle = '#ffffff';
    ctx.font = `700 ${TITULO_CONFIG.tamano}px LaLiga, Arial, sans-serif`;
    dibujarTextoCurvo(TITULO_CONFIG.texto, TITULO_CONFIG.x, TITULO_CONFIG.y, TITULO_CONFIG.curvatura, 'izquierda');

    const nuevasHitboxes = [];
    posiciones.forEach((pos, i) => {
      if (ALINEACION[i]) {
        const ajuste = obtenerAjuste(formacionKey, i);
        const px = pos.x + ajuste.dx;
        const py = pos.y + ajuste.dy;
        dibujarJugador(ALINEACION[i], px, py, FICHA_W, FICHA_H, imagenes[i]);
        nuevasHitboxes.push({
          x: px - FICHA_W / 2, y: py - FICHA_H / 2,
          w: FICHA_W, h: FICHA_H, slot: i
        });
      }
    });
    hitboxes = nuevasHitboxes; // se sustituye entera solo si este dibujo es el vigente

    // Capa superior: imagen subida por el usuario, por encima de todo, con opacidad reducida
    if (capaSuperiorImg) {
      ctx.save();
      ctx.globalAlpha = CAPA_SUPERIOR_CONFIG.opacidad;
      ctx.drawImage(capaSuperiorImg, 0, 0, CANVAS_W, CANVAS_H);
      ctx.restore();
    }
  }

  // ============================
  // CLIC SOBRE UNA FICHA -> ABRIR SELECTOR
  // ============================
  let slotActivo = null;

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const escala = CANVAS_W / rect.width;
    const x = (e.clientX - rect.left) * escala;
    const y = (e.clientY - rect.top) * escala;

    const hit = hitboxes.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
    if (hit) abrirSelector(hit.slot);
  });

  const overlay = document.getElementById('overlay');
  const buscador = document.getElementById('buscador');
  const listaJugadores = document.getElementById('listaJugadores');

  function abrirSelector(slot) {
    slotActivo = slot;
    buscador.value = '';
    renderLista('');
    overlay.classList.add('activo');
    buscador.focus();
  }

  function cerrarSelector() {
    overlay.classList.remove('activo');
    slotActivo = null;
  }

  function renderLista(filtro) {
    const texto = filtro.trim().toLowerCase();
    const filtrados = PLANTILLA.filter(j => j.nombre.toLowerCase().includes(texto));
    listaJugadores.innerHTML = '';
    filtrados.forEach(j => {
      const div = document.createElement('div');
      div.className = 'item-jugador';
      div.innerHTML = `<span class="num">${j.numero}</span><span class="nom">${j.nombre}</span><span class="rol">${j.texto}</span>`;
      div.addEventListener('click', () => {
        ALINEACION[slotActivo] = j;
        cerrarSelector();
        dibujarAlineacion(selector.value);
      });
      listaJugadores.appendChild(div);
    });
  }

  buscador.addEventListener('input', () => renderLista(buscador.value));
  document.getElementById('cerrarModal').addEventListener('click', cerrarSelector);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrarSelector(); });

  // ============================
  // INTERFAZ
  // ============================
  const selector = document.getElementById('formacionSelector');
  Object.keys(FORMACIONES).forEach(nombre => {
    const opt = document.createElement('option');
    opt.value = nombre;
    opt.textContent = nombre;
    selector.appendChild(opt);
  });
  selector.value = '4-3-3';
  selector.disabled = true;
  selector.addEventListener('change', () => dibujarAlineacion(selector.value));

  function esIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  document.getElementById('btnDescargar').addEventListener('click', () => {
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const nombreArchivo = `alineacion_${selector.value}.png`;

      if (esIOS()) {
        // Safari en iPhone no soporta la descarga directa de blobs (el atributo
        // "download" no funciona). Usamos el menú nativo de compartir, que
        // permite guardar la imagen en Fotos; si no está disponible, la
        // abrimos en una pestaña nueva para guardarla manteniendo pulsado.
        const file = new File([blob], nombreArchivo, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Alineación' });
            return;
          } catch (err) {
            // El usuario canceló el share o falló: seguimos con el fallback
          }
        }
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
        return;
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nombreArchivo;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });

  // ============================
  // CAPA SUPERIOR (imagen subida desde el móvil, opacidad al 30%)
  // ============================
  const inputCapa = document.getElementById('inputCapa');
  const btnQuitarCapa = document.getElementById('btnQuitarCapa');

  inputCapa.addEventListener('change', () => {
    const archivo = inputCapa.files[0];
    if (!archivo) return;
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      capaSuperiorImg = img;
      btnQuitarCapa.style.display = 'inline-block';
      dibujarAlineacion(selector.value);
    };
    img.src = url;
  });

  btnQuitarCapa.addEventListener('click', () => {
    capaSuperiorImg = null;
    inputCapa.value = '';
    btnQuitarCapa.style.display = 'none';
    dibujarAlineacion(selector.value);
  });

  // Espera a que la fuente LaLiga esté cargada antes de dibujar en el canvas
  // (si no, el canvas usaría Arial en la primera pintada).
  async function cargarFuente() {
    const carga = (async () => {
      await document.fonts.load('700 40px LaLiga', 'MARÍN 11 POSIBLE');
      await document.fonts.load('400 40px LaLiga', 'DEF 0123456789');
    })();
    const limite = new Promise(res => setTimeout(res, 6000));
    try { await Promise.race([carga, limite]); }
    catch (e) { console.warn('No se pudo cargar la fuente LaLiga', e); }
  }

  (async () => {
    await Promise.all([precargarTodo(), cargarFuente()]);
    document.getElementById('cargando').style.display = 'none';
    selector.disabled = false;
    dibujarAlineacion(selector.value);
  })();

  // ===== TEMPORAL: mover escudos (borrar todo este bloque, su CSS y su HTML al terminar) =====
  (function () {
    const NUM_JUGADORES = 11;
    const contenedor = document.getElementById('contenedorCanvas');
    const salida = document.getElementById('tmpSalida');
    const btnModo = document.getElementById('tmpModo');
    const etiquetaSel = document.getElementById('tmpSel');
    let modoMover = false;
    let arrastre = null;
    let slotSel = null;

    // Deja la lista de la formación con los 11 jugadores rellenos (0,0 si no había ajuste)
    function asegurar(f) {
      const lista = AJUSTES_POSICION[f] || (AJUSTES_POSICION[f] = []);
      for (let i = 0; i < NUM_JUGADORES; i++) {
        const a = lista[i] || {};
        lista[i] = { dx: a.dx || 0, dy: a.dy || 0 };
      }
    }

    // Texto listo para pegar en el código: el objeto AJUSTES_POSICION completo
    function textoPosiciones() {
      const lineas = Object.keys(FORMACIONES).map(f => {
        const ajustes = Array.from({ length: NUM_JUGADORES }, (_, i) => obtenerAjuste(f, i));
        const hay = ajustes.some(a => a.dx || a.dy);
        const cuerpo = hay ? '[ ' + ajustes.map(a => `{ dx: ${a.dx}, dy: ${a.dy} }`).join(', ') + ' ]' : '[]';
        return `    "${f}": ${cuerpo}`;
      });
      return 'const AJUSTES_POSICION = {\n' + lineas.join(',\n') + '\n  };';
    }

    let pendiente = false;
    function pedirRedibujo() {
      salida.value = textoPosiciones();
      if (pendiente) return;
      pendiente = true;
      requestAnimationFrame(() => { pendiente = false; dibujarAlineacion(selector.value); });
    }

    function aplicar(f, slot, dx, dy) {
      asegurar(f);
      AJUSTES_POSICION[f][slot] = { dx: Math.round(dx), dy: Math.round(dy) };
      pedirRedibujo();
    }

    function seleccionar(slot) {
      slotSel = slot;
      const j = ALINEACION[slot];
      etiquetaSel.textContent = 'Escudo seleccionado: ' + (j ? j.nombre : slot);
    }

    function aCanvas(e) {
      const rect = canvas.getBoundingClientRect();
      const escala = CANVAS_W / rect.width;
      return { x: (e.clientX - rect.left) * escala, y: (e.clientY - rect.top) * escala };
    }

    // Modo mover: mientras está activo, tocar un escudo NO abre el selector de jugador
    btnModo.addEventListener('click', () => {
      modoMover = !modoMover;
      btnModo.textContent = 'Modo mover: ' + (modoMover ? 'SÍ' : 'NO');
      btnModo.classList.toggle('activo', modoMover);
      canvas.classList.toggle('tmpMoviendo', modoMover);
    });
    contenedor.addEventListener('click', (e) => { if (modoMover) e.stopPropagation(); }, true);

    canvas.addEventListener('pointerdown', (e) => {
      if (!modoMover) return;
      const { x, y } = aCanvas(e);
      const hit = hitboxes.slice().reverse().find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
      if (!hit) return;
      const f = selector.value;
      arrastre = { f, slot: hit.slot, x0: x, y0: y, base: obtenerAjuste(f, hit.slot) };
      seleccionar(hit.slot);
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!arrastre) return;
      const { x, y } = aCanvas(e);
      aplicar(arrastre.f, arrastre.slot, arrastre.base.dx + (x - arrastre.x0), arrastre.base.dy + (y - arrastre.y0));
    });
    const soltar = () => { arrastre = null; };
    canvas.addEventListener('pointerup', soltar);
    canvas.addEventListener('pointercancel', soltar);

    // Flechas para afinar el escudo seleccionado
    document.querySelectorAll('#tmpMover [data-mov]').forEach(b => {
      b.addEventListener('click', () => {
        if (slotSel === null) { etiquetaSel.textContent = 'Primero toca un escudo en modo mover'; return; }
        const paso = parseInt(document.getElementById('tmpPaso').value, 10);
        const [mx, my] = b.dataset.mov.split(',').map(Number);
        const f = selector.value;
        const base = obtenerAjuste(f, slotSel);
        aplicar(f, slotSel, base.dx + mx * paso, base.dy + my * paso);
      });
    });

    document.getElementById('tmpReset').addEventListener('click', () => {
      const f = selector.value;
      if (!confirm('¿Restablecer las posiciones de la formación ' + f + '?')) return;
      AJUSTES_POSICION[f] = [];
      pedirRedibujo();
    });

    // Copiar todas las posiciones para pegarlas en el chat
    const estado = document.getElementById('tmpEstado');
    document.getElementById('tmpCopiar').addEventListener('click', async () => {
      const texto = textoPosiciones();
      try {
        await navigator.clipboard.writeText(texto);
      } catch (e) {
        salida.focus(); salida.select();
        try { document.execCommand('copy'); } catch (e2) {}
      }
      estado.textContent = '¡Copiado!';
      setTimeout(() => { estado.textContent = ''; }, 1800);
    });

    salida.value = textoPosiciones();
  })();
  // ===== FIN TEMPORAL =====

</script>

</body>
</html>
