  * { box-sizing: border-box; }

  html, body {

  #app {

    min-height: 100vh;
  }

  #topbar {
    background: linear-gradient(180deg,#141821,#0f1218);
    border-bottom: 1px solid #232a36;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    flex-direction: column;
    margin-right: 8px;
  }
  .brand b { font-size: 14px; letter-spacing: .04em; color: #fefefe; }
  .brand span { font-size: 11px; color: #7c8698; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 120px;
  }
  .field label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #8a93a6;
  }
  .field input[type=text],
  .field input[type=number] {
    background: #1a2029;
    border: 1px solid #2a3140;
    color: #eef2f6;
    padding: 7px 9px;
    border-radius: 6px;
    font-size: 13px;
    min-width: 160px;
  }
  .field input[type=range] { width: 150px; accent-color: #4d7fff; }
  .field .valtag { font-size: 10.5px; color: #6d7890; }

  .btn {
    background: #232b3a;
    border: 1px solid #313b4e;
    color: #eef2f6;
    padding: 9px 14px;
    border-radius: 7px;
    font-size: 12.5px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: .02em;
    transition: background .15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: #2c3648; }
  .btn.primary { background: #3457d5; border-color: #4a6bea; }
  .btn.primary:hover { background: #3d63ec; }
  .btn.toggle-on { background: #1e7a4d; border-color: #269a61; }

  .filebtn {
    position: relative;
    overflow: hidden;
  }
  .filebtn input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  #stage-wrap {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 26px 16px 60px;
    overflow: auto;
  }

  #stage {
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    border: 1px solid #232a36;
    background: #000;
  }

  #stage canvas {
    display: block;
    width: 100%;
    height: auto;
  }

  .divider {
    width: 1px;
    align-self: stretch;
    background: #232a36;
    margin: 0 2px;
  }

  .group {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
  }

  #hint {
    font-size: 11px;
    color: #5b6579;
    margin-top: 6px;
    padding: 0 4px;
  }

  #stage {
    width: min(640px, 92vw);
  }

  /* -------- Móvil: panel apilado a pantalla completa -------- */
  @media (max-width: 640px) {
    #topbar {
      flex-direction: column;
      align-items: stretch;
      padding: 12px;
      gap: 10px;
    }
    .brand { margin-right: 0; }
    .divider { display: none; }
    .field { min-width: 0; width: 100%; }
    .field input[type=text] { width: 100%; min-width: 0; font-size: 16px; }
    .btn { width: 100%; text-align: center; }
    .filebtn { width: 100%; }
    #stage-wrap { padding: 16px 10px 40px; }
    #stage { width: 100%; }

<div id="app">

  <div id="topbar">
    <div class="brand"><b>1909 RSO</b><span>Editor RENOVADO · 2000×2500</span></div>

    <div class="divider"></div>

    <div class="field">
      <label>Fondo</label>
      <button class="btn filebtn">Subir imagen
        <input type="file" id="bgInput" accept="image/*">
      </button>
    </div>

    <div class="divider"></div>

    <div class="field" style="min-width:320px;">
      <label>Texto</label>
      <input type="text" id="textInput" value="RENOVADO">
    </div>

    <button class="btn" id="toggleLinesBtn">2 líneas</button>

    <div class="divider"></div>

    <button class="btn primary" id="downloadBtn">Descargar PNG</button>
  </div>

  <div id="stage-wrap">
    <div>
      <div id="stage">
        <canvas id="canvas" width="2000" height="2500"></canvas>
      </div>
      <div id="hint">Márgenes laterales fijos de 175px · Posición ancla la parte de ABAJO del texto (CONFIG.startY) · Espaciado entre letras editable en CONFIG.letterSpacingRatio · Carácter de espacio corregido</div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   CONFIG — valores editables directamente en código
   ============================================================ */
const CONFIG = {
  canvasW: 2000,
  canvasH: 2500,

  marginX: 75,           // distancia lateral fija a cada lado (px)

  // El texto SIEMPRE termina (parte de ABAJO de las letras, ej. la base
  // de la "R") en este píxel — no es la parte de arriba.
  // En modo 2 LÍNEAS, es la parte de ABAJO de la línea de ABAJO (la línea
  // de arriba se coloca por encima usando lineGapRatio).
  // ⚠️ Este valor SOLO se cambia aquí, en el código — no hay control en el menú.
  startY: 2330,

  // Distancia entre la línea de ARRIBA y la línea de ABAJO, en modo 2
  // líneas — como fracción del tamaño de fuente, NO en píxeles fijos.
  // Así, si el texto tiene más caracteres y el autoajuste reduce el
  // tamaño de la fuente, la distancia entre líneas se hace menor en la
  // misma proporción (y crece si la fuente es más grande).
  // El tamaño usado es el promedio del tamaño de ambas líneas.
  // 1 = separación equivalente a un tamaño de fuente completo.
  // ⚠️ Fijo — SOLO se cambia aquí, no hay control en el menú.
  lineGapRatio: 1,

  // Espaciado extra entre letras, como fracción del tamaño de fuente.
  // 0 = espaciado nativo de la fuente (normal). Positivo = separa más las
  // letras, negativo = las junta más. ⚠️ Solo editable aquí en el código,
  // no hay control en el menú.
  letterSpacingRatio: 0.05,

  // Deformación vertical del texto: estira (o comprime) la altura de las
  // letras SIN cambiar su anchura, manteniendo el ancho ya calculado por
  // el autoajuste. 1 = normal. 1.2 = un 20% más alto. 0.85 = más bajo/aplastado.
  // Se aplica alrededor de la línea base, así que el texto crece hacia
  // arriba (y un poco hacia abajo si hay letras con rabito, como "g" o "j").
  // ⚠️ Solo se aplica en modo 2 LÍNEAS, y únicamente a la línea de ABAJO.
  // En modo 1 línea el texto siempre queda normal (sin deformar), y la
  // línea de arriba en modo 2 líneas también queda siempre normal.
  // Solo editable aquí en el código, no hay control en el menú.
  textVerticalStretch: 2,

  // El espaciado entre letras usa el avance NATIVO de cada glifo de la fuente
  // (más el ajuste de letterSpacingRatio de arriba) — no es editable desde el menú.
  // El único carácter roto en la fuente FBR es el espacio (" "), así que se
  // sustituye su ancho por esta fracción del tamaño de fuente. Edítalo aquí
  // si el hueco entre palabras se ve muy grande o muy pequeño.
  spaceWidthRatio: 0.28,

  maxFontSize: 500,
  minFontSize: 30,

  colorTop: '#fefefe',    // arriba del degradado
  colorBottom: '#ccd9e3', // abajo del degradado

  fontFamily: 'FBR',
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let bgImage = null;
let overlayImage = new Image();
let overlayReady = false;
let fontReady = false;

overlayImage.onload = () => { overlayReady = true; redraw(); };
overlayImage.src = OVERLAY_SRC;

document.fonts.load('220px FBR').then(() => document.fonts.ready).then(() => {
  fontReady = true;
  redraw();
});

/* ---------------- UI refs ---------------- */
const bgInput = document.getElementById('bgInput');
const textInput = document.getElementById('textInput');
const toggleLinesBtn = document.getElementById('toggleLinesBtn');
const downloadBtn = document.getElementById('downloadBtn');

let twoLines = false;

/* ---------------- Events ---------------- */
bgInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => { bgImage = img; redraw(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

textInput.addEventListener('input', redraw);

toggleLinesBtn.addEventListener('click', () => {
  twoLines = !twoLines;
  toggleLinesBtn.textContent = twoLines ? '1 línea' : '2 líneas';
  toggleLinesBtn.classList.toggle('toggle-on', twoLines);
  redraw();
});

downloadBtn.addEventListener('click', () => {
  downloadBtn.disabled = true;
  const originalLabel = downloadBtn.textContent;
  downloadBtn.textContent = 'Generando…';

  canvas.toBlob(async (blob) => {
    downloadBtn.disabled = false;
    downloadBtn.textContent = originalLabel;
    if (!blob) return;

    const fileName = 'renovado_1909rso.png';
    const file = new File([blob], fileName, { type: 'image/png' });

    // iPhone/Safari: el <a download> no siempre funciona (sobre todo en
    // Safari o dentro de apps con webview). El Web Share API permite
    // guardar en Fotos o compartir directamente, y es el método fiable
    // en iOS. Si no está disponible, caemos a la descarga clásica y,
    // como último recurso, abrimos la imagen en una pestaña nueva para
    // que el usuario pueda mantener pulsado y guardarla.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '1909 RSO' });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return; // usuario canceló
        // si falla el share, seguimos con el fallback de abajo
      }
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // Fallback adicional para Safari/iOS antiguo, que ignora el atributo
    // "download": abrimos la imagen en una pestaña nueva.
    setTimeout(() => {
      window.open(url, '_blank');
      URL.revokeObjectURL(url);
    }, 300);
  }, 'image/png');
});

/* ============================================================
   Medición y dibujo de texto — espaciado NATIVO de la fuente,
   corrigiendo únicamente el carácter de espacio (roto en FBR).
   ============================================================ */
function charWidth(ch, fontSize) {
  // El glifo de espacio de la fuente FBR viene mal configurado:
  // se sustituye por un ancho fijo proporcional al tamaño de fuente
  // (ver CONFIG.spaceWidthRatio). El resto de caracteres usa el
  // avance nativo del glifo tal cual lo da la fuente.
  if (ch === ' ') return fontSize * CONFIG.spaceWidthRatio;
  return ctx.measureText(ch).width;
}

function letterSpacingPx(fontSize) {
  return fontSize * CONFIG.letterSpacingRatio;
}

function measureTextNative(text, fontSize) {
  ctx.font = `${fontSize}px ${CONFIG.fontFamily}`;
  const spacing = letterSpacingPx(fontSize);
  let width = 0;
  for (const ch of text) {
    width += charWidth(ch, fontSize) + spacing;
  }
  width -= spacing; // sin espaciado extra tras el último carácter
  return Math.max(width, 0);
}

// Busca el tamaño de fuente más grande que quepa dentro de maxWidth
function fitFontSize(text, maxWidth) {
  if (!text) return CONFIG.minFontSize;
  let lo = CONFIG.minFontSize, hi = CONFIG.maxFontSize, best = CONFIG.minFontSize;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    const w = measureTextNative(text, mid);
    if (w <= maxWidth) { best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}

function drawTextLine(text, fontSize, bottomY, stretch = 1) {
  ctx.font = `${fontSize}px ${CONFIG.fontFamily}`;
  const metrics = ctx.measureText(text || 'M');
  const ascent = metrics.actualBoundingBoxAscent || fontSize * 0.75;
  const descent = metrics.actualBoundingBoxDescent || fontSize * 0.2;

  // bottomY es la parte de ABAJO del texto (ej. la base de la "R"), medida
  // SIN deformar. La línea base se calcula a partir de ahí y se mantiene
  // fija; la deformación vertical crece/decrece alrededor de esa base.
  const baseline = bottomY - descent;
  const topY = baseline - ascent * stretch;
  const visualBottom = baseline + descent * stretch;

  const spacing = letterSpacingPx(fontSize);
  const totalWidth = measureTextNative(text, fontSize); // ancho SIN deformar
  let cx = (CONFIG.canvasW - totalWidth) / 2;

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  // La deformación vertical se aplica con un escalado en Y alrededor de la
  // línea base; el eje X no se toca, así que la anchura no cambia.
  // ⚠️ El degradado se crea DESPUÉS de aplicar translate+scale, usando
  // coordenadas LOCALES (relativas a la línea base). Si se crea antes con
  // coordenadas absolutas, el motor del canvas reinterpreta esas
  // coordenadas bajo la nueva transformación al pintar y el degradado
  // sale desplazado / roto — por eso fallaba.
  ctx.save();
  ctx.translate(0, baseline);
  ctx.scale(1, stretch);

  const gradient = ctx.createLinearGradient(0, -ascent, 0, descent);
  gradient.addColorStop(0, CONFIG.colorTop);
  gradient.addColorStop(1, CONFIG.colorBottom);
  ctx.fillStyle = gradient;

  for (const ch of text) {
    if (ch !== ' ') ctx.fillText(ch, cx, 0);
    cx += charWidth(ch, fontSize) + spacing;
  }
  ctx.restore();

  return { top: topY, bottom: visualBottom };
}

// Divide el texto en 2 líneas partiendo por palabras completas (nunca corta
// una palabra por la mitad), buscando que cada línea tenga la MISMA cantidad
// de texto (o lo más parecida posible), midiendo por número de caracteres —
// sin tener en cuenta cuántas palabras caen en cada línea.
// Si solo hay una palabra, la segunda línea queda vacía.
function splitIntoTwoLines(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean);
  if (words.length <= 1) return [words.join(' '), ''];

  let bestSplit = 1;
  let bestDiff = Infinity;
  for (let k = 1; k < words.length; k++) {
    const line1 = words.slice(0, k).join(' ');
    const line2 = words.slice(k).join(' ');
    const diff = Math.abs(line1.length - line2.length);
    if (diff < bestDiff) { bestDiff = diff; bestSplit = k; }
  }
  return [words.slice(0, bestSplit).join(' '), words.slice(bestSplit).join(' ')];
}

/* ============================================================
   Render principal
   ============================================================ */
function redraw() {
  ctx.clearRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);

  // Capa 1: fondo subido por el usuario
  if (bgImage) {
    drawCover(bgImage);
  } else {
    ctx.fillStyle = '#111318';
    ctx.fillRect(0, 0, CONFIG.canvasW, CONFIG.canvasH);
  }

  // Capa 2: overlay estático (imagen fija desde GitHub, embebida)
  if (overlayReady) {
    ctx.drawImage(overlayImage, 0, 0, CONFIG.canvasW, CONFIG.canvasH);
  }

  // Capa 3: texto
  if (!fontReady) return;

  const maxWidth = CONFIG.canvasW - CONFIG.marginX * 2;
  const bottomY = CONFIG.startY; // fijo desde el código — parte de ABAJO del texto
  const fullText = textInput.value || '';

  if (!twoLines) {
    // Modo 1 línea: SIEMPRE normal, sin deformación vertical.
    const size = fitFontSize(fullText, maxWidth);
    drawTextLine(fullText, size, bottomY, 1);
  } else {
    const [t1, t2] = splitIntoTwoLines(fullText);
    const size1 = fitFontSize(t1, maxWidth);
    const size2 = fitFontSize(t2, maxWidth);
    // La distancia entre líneas se calcula a partir del tamaño de fuente
    // de ambas líneas (promedio), así que se adapta automáticamente: si
    // una línea tiene más caracteres y su fuente se reduce, la separación
    // también se reduce en proporción.
    const gap = ((size1 + size2) / 2) * CONFIG.lineGapRatio;
    // CONFIG.startY es SIEMPRE la parte de ABAJO de la línea de ABAJO
    // (igual que en modo 1 línea, para que el ancla sea coherente en
    // ambos modos). La línea de arriba se coloca "gap" píxeles por
    // encima de esa referencia.
    // La deformación vertical (CONFIG.textVerticalStretch) solo afecta a
    // la línea de ABAJO; la línea de arriba siempre queda normal.
    drawTextLine(t1, size1, bottomY - gap, 1);
    drawTextLine(t2, size2, bottomY, CONFIG.textVerticalStretch || 1);
  }
}

function drawCover(img) {
  const cw = CONFIG.canvasW, ch = CONFIG.canvasH;
  const ir = img.width / img.height;
  const cr = cw / ch;
  let dw, dh, dx, dy;
  if (ir > cr) {
    dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0;
  } else {
    dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2;
  }
  ctx.drawImage(img, dx, dy, dw, dh);
}

redraw();
</script>
