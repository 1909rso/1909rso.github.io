<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Entrenamientos</title>
<style>
  /* ============================================================
     CONFIG (edita aquí colores, años, textos)
     ============================================================ */
  :root{
    --bg:#050810;
    --panel:#0a1120;
    --panel-border:#152037;
    --grid-empty:#101a2c;
    --level1:#0f3159;
    --level2:#155a94;
    --level3:#1c8ad6;
    --level4:#e0b94d; /* nivel máximo: dorado, no azul */
    --dot:#f4f8ff;
    --text:#e9f1fb;
    --muted:#6e84a3;
    --accent:#2b8fe0;
    --accent-soft:#12233d;
    --danger:#e0512b;
    --danger-soft:#3a1610;
    --today-ring:#f4f8ff;
    --cell:11px;
    --gap:3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 140% at 10% -10%, #0a1830 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:80px;
  }

  header{
    padding:34px 20px 22px;
    border-bottom:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header .brand{
    color:var(--accent);
    font-weight:900;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:16px 20px;
    border-bottom:1px solid var(--panel-border);
  }
  button, .file-btn{
    background:var(--accent-soft);
    color:var(--text);
    border:1px solid var(--panel-border);
    padding:9px 14px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  button.primary{
    background:var(--accent);
    color:#03101f;
    border-color:transparent;
  }
  button.active{
    background:var(--level4);
    color:#03101f;
    border-color:transparent;
  }
  button.danger{
    background:var(--danger-soft);
    color:#ffb199;
    border-color:#5c2318;
  }
  button.danger.active{
    background:var(--danger);
    color:#1a0603;
    border-color:transparent;
  }
  button:hover{filter:brightness(1.15);}
  input[type=file]{display:none;}

  main{
    padding:10px 20px 40px;
    max-width:1000px;
    margin:0 auto;
  }

  .year-block{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:20px 18px 16px;
    margin:22px 0;
  }
  .year-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:14px;
    gap:10px;
  }
  .year-head h2{
    margin:0;
    font-size:20px;
    font-weight:800;
  }
  .year-head .count{
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    margin-right:auto;
    margin-left:10px;
  }
  .year-del{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--muted);
    padding:4px 9px;
    border-radius:7px;
    font-size:11px;
    cursor:pointer;
    font-weight:600;
  }
  .year-del:hover{
    color:#ffb199;
    border-color:#5c2318;
  }

  .cal-scroll{
    overflow-x:auto;
    padding-bottom:4px;
  }
  .cal-wrap{
    display:flex;
    gap:8px;
    width:max-content;
  }
  .day-labels{
    display:grid;
    grid-template-rows:16px repeat(7,var(--cell));
    row-gap:var(--gap);
    font-size:9px;
    color:var(--muted);
    padding-top:0;
  }
  .day-labels span{
    height:var(--cell);
    line-height:var(--cell);
  }

  .grid-area{
    display:grid;
    grid-auto-flow:column;
    grid-template-rows:16px repeat(7,var(--cell));
    row-gap:var(--gap);
    column-gap:var(--gap);
  }
  .month-label{
    grid-row:1;
    font-size:10px;
    color:var(--muted);
    align-self:end;
    white-space:nowrap;
  }
  .cell{
    width:var(--cell);
    height:var(--cell);
    border-radius:3px;
    background:var(--grid-empty);
    position:relative;
    cursor:pointer;
  }
  .cell.pad{
    background:transparent;
    cursor:default;
  }
  .cell.l1{background:var(--level1);}
  .cell.l2{background:var(--level2);}
  .cell.l3{background:var(--level3);}
  .cell.l4{background:var(--level4);}
  .cell.is-today{
    box-shadow:0 0 0 1px var(--today-ring);
  }
  .cell .dot{
    position:absolute;
    top:50%;left:50%;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--dot);
    transform:translate(-50%,-50%);
    box-shadow:0 0 2px rgba(255,255,255,.8);
  }
  .cell:hover{outline:1px solid var(--accent);}
  body.delete-mode .cell:hover{outline:1px solid var(--danger);}

  .legend{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--muted);
    margin-top:12px;
    justify-content:flex-end;
  }
  .legend .sw{width:10px;height:10px;border-radius:2px;}

  .modal-bg{
    display:none;
    position:fixed;inset:0;
    background:rgba(2,6,14,.72);
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:22px;
    width:100%;
    max-width:360px;
  }
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:12px 0 5px;
  }
  .modal input[type=date],
  .modal input[type=number],
  .modal textarea,
  .modal select{
    width:100%;
    background:#050b16;
    border:1px solid var(--panel-border);
    color:var(--text);
    padding:9px 10px;
    border-radius:8px;
    font-size:14px;
  }
  .modal .row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .modal .actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  .modal .actions button{flex:1;}
</style>
</head>
<body>

<header>
  <h1><span class="brand">Historial</span> de Entrenamientos</h1>
  <p>Toca un día para marcarlo. Modo punto para señalar días especiales. Modo borrar para limpiar un día directamente.</p>
</header>

<div class="toolbar">
  <button id="btnAdd" class="primary">＋ Añadir entrada</button>
  <button id="btnDotMode">● Modo punto: OFF</button>
  <button id="btnDeleteMode" class="danger">🗑 Modo borrar: OFF</button>
  <button id="btnToday">📅 Hoy</button>
  <button id="btnAddYear">＋ Añadir año</button>
  <label class="file-btn" for="importFile">Importar datos</label>
  <input type="file" id="importFile" accept="application/json">
  <button id="btnExport">Exportar datos</button>
  <button id="btnExportImg">🖼 Exportar imagen</button>
  <button id="btnClearAll" class="danger">🗑 Borrar todo</button>
</div>

<main id="main"></main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Añadir / editar entrada</h3>
    <label>Fecha</label>
    <input type="date" id="mDate">
    <label>Nivel de entrenamiento</label>
    <select id="mLevel">
      <option value="0">0 — Sin entrenar</option>
      <option value="1">1 — Suave</option>
      <option value="2">2 — Normal</option>
      <option value="3">3 — Intenso</option>
      <option value="4">4 — Máximo</option>
    </select>
    <div class="row">
      <input type="checkbox" id="mDot" style="width:16px;height:16px;">
      <label style="margin:0;">Marcar punto blanco</label>
    </div>
    <label>Nota (opcional)</label>
    <textarea id="mNote" rows="2"></textarea>
    <div class="actions">
      <button id="mCancel">Cancelar</button>
      <button id="mSave" class="primary">Guardar</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  storageKeyData: 'workoutHistoryData',   // { 'YYYY-MM-DD': {level:0-4, dot:bool, note:''} }
  storageKeyYears: 'workoutHistoryYears', // años extra añadidos manualmente
  startYear: 2026, // el historial arranca aquí; los años siguientes se generan solos según la fecha real
  weekStartsMonday: true,
  dayLabels: ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],
  visibleDayLabels: [0,2,4,6], // Lun, Mié, Vie, Dom
  monthNames: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']
};

/* ============================================================
   STATE
   ============================================================ */
let data = loadData();
let years = loadYears();
let dotMode = false;
let deleteMode = false;

function loadData(){
  try{ return JSON.parse(localStorage.getItem(CONFIG.storageKeyData)) || {}; }
  catch(e){ return {}; }
}
function saveData(){
  localStorage.setItem(CONFIG.storageKeyData, JSON.stringify(data));
}
function loadYears(){
  // Rango automático: desde CONFIG.startYear hasta el año actual real.
  // Al cambiar de año (ej. 1 de enero de 2027) este rango se recalcula solo
  // y aparece el nuevo año sin tener que tocar nada.
  const currentYear = new Date().getFullYear();
  const autoRange = [];
  for(let y=CONFIG.startYear; y<=currentYear; y++) autoRange.push(y);

  let stored = [];
  try{ stored = JSON.parse(localStorage.getItem(CONFIG.storageKeyYears)) || []; }catch(e){}

  const merged = new Set([...autoRange, ...stored]);
  return Array.from(merged).sort((a,b)=>b-a);
}
function saveYears(){
  localStorage.setItem(CONFIG.storageKeyYears, JSON.stringify(years));
}

function iso(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============================================================
   CALENDAR GRID BUILD (estilo GitHub, semana Lun-Dom)
   ============================================================ */
function buildYearGrid(year){
  const jan1 = new Date(year,0,1);
  const dec31 = new Date(year,11,31);

  const startOffset = (jan1.getDay()+6)%7; // 0=Lun
  const gridStart = new Date(jan1);
  gridStart.setDate(jan1.getDate()-startOffset);

  const endOffset = (dec31.getDay()+6)%7;
  const gridEnd = new Date(dec31);
  gridEnd.setDate(dec31.getDate()+(6-endOffset));

  const totalDays = Math.round((gridEnd-gridStart)/86400000)+1;
  const totalCols = totalDays/7;

  const cols = [];
  for(let c=0;c<totalCols;c++){
    const col = [];
    for(let r=0;r<7;r++){
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate()+c*7+r);
      col.push(d);
    }
    cols.push(col);
  }
  return cols;
}

function monthLabelsFor(cols, year){
  const labels = [];
  let lastMonth = -1;
  cols.forEach((col,ci)=>{
    const d = col[0]; // lunes de esa semana
    if(d.getFullYear()===year && d.getDate()<=7 && d.getMonth()!==lastMonth){
      labels.push({col:ci, text:CONFIG.monthNames[d.getMonth()]});
      lastMonth = d.getMonth();
    }
  });
  return labels;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const todayKey = iso(new Date());

  years.sort((a,b)=>b-a).forEach(year=>{
    const cols = buildYearGrid(year);
    const monthLabels = monthLabelsFor(cols, year);

    let count = 0;
    Object.keys(data).forEach(k=>{
      if(k.startsWith(year+'-') && data[k].level>0) count++;
    });

    const block = document.createElement('div');
    block.className='year-block';
    block.dataset.year = year;

    block.innerHTML = `
      <div class="year-head">
        <h2>${year}</h2>
        <span class="count">${count} entrenamientos</span>
        <button class="year-del" data-year="${year}">Borrar año</button>
      </div>
      <div class="cal-scroll" id="scroll-${year}">
        <div class="cal-wrap">
          <div class="day-labels" id="dl-${year}"></div>
          <div class="grid-area" id="ga-${year}" style="grid-template-columns:repeat(${cols.length},var(--cell));"></div>
        </div>
      </div>
      <div class="legend">
        <span>Menos</span>
        <span class="sw" style="background:var(--grid-empty)"></span>
        <span class="sw" style="background:var(--level1)"></span>
        <span class="sw" style="background:var(--level2)"></span>
        <span class="sw" style="background:var(--level3)"></span>
        <span class="sw" style="background:var(--level4)"></span>
        <span>Más</span>
      </div>
    `;
    main.appendChild(block);

    // borrar año completo
    block.querySelector('.year-del').addEventListener('click', ()=>{
      const ok = confirm(`¿Borrar todas las entradas de ${year}? Esta acción no se puede deshacer.`);
      if(!ok) return;
      Object.keys(data).forEach(k=>{
        if(k.startsWith(year+'-')) delete data[k];
      });
      saveData();
      render();
    });

    // day labels
    const dl = block.querySelector(`#dl-${year}`);
    dl.innerHTML += `<span></span>`; // spacer for month row
    CONFIG.dayLabels.forEach((lab,i)=>{
      const s = document.createElement('span');
      s.textContent = CONFIG.visibleDayLabels.includes(i) ? lab : '';
      dl.appendChild(s);
    });

    // grid
    const ga = block.querySelector(`#ga-${year}`);
    cols.forEach((col,ci)=>{
      const ml = monthLabels.find(m=>m.col===ci);
      const label = document.createElement('div');
      label.className='month-label';
      label.style.gridColumn = ci+1;
      label.textContent = ml ? ml.text : '';
      ga.appendChild(label);

      col.forEach((d,ri)=>{
        const cell = document.createElement('div');
        const inYear = d.getFullYear()===year;
        cell.style.gridColumn = ci+1;
        cell.style.gridRow = ri+2;
        if(!inYear){
          cell.className='cell pad';
        } else {
          const key = iso(d);
          const entry = data[key];
          const level = entry ? entry.level : 0;
          cell.className = 'cell'+(level>0?' l'+level:'')+(key===todayKey?' is-today':'');
          cell.dataset.date = key;
          cell.title = key + (entry && entry.note ? (' — '+entry.note) : '');
          if(entry && entry.dot){
            const dot = document.createElement('span');
            dot.className='dot';
            cell.appendChild(dot);
          }
          cell.addEventListener('click', ()=>onCellClick(key));
        }
        ga.appendChild(cell);
      });
    });
  });
}

function onCellClick(key){
  if(deleteMode){
    if(data[key]){
      delete data[key];
      saveData();
      render();
    }
    return; // en modo borrar nunca se cicla color, solo se limpia
  }

  const entry = data[key] || {level:0, dot:false, note:''};
  if(dotMode){
    entry.dot = !entry.dot;
  } else {
    entry.level = (entry.level+1) % 5;
  }
  if(entry.level===0 && !entry.dot && !entry.note){
    delete data[key];
  } else {
    data[key] = entry;
  }
  saveData();
  render();
}

/* ============================================================
   TOOLBAR
   ============================================================ */
document.getElementById('btnDotMode').addEventListener('click', (e)=>{
  dotMode = !dotMode;
  if(dotMode && deleteMode){
    deleteMode = false;
    updateDeleteModeBtn();
  }
  e.target.textContent = '● Modo punto: '+(dotMode?'ON':'OFF');
  e.target.classList.toggle('active', dotMode);
});

function updateDeleteModeBtn(){
  const btn = document.getElementById('btnDeleteMode');
  btn.textContent = '🗑 Modo borrar: '+(deleteMode?'ON':'OFF');
  btn.classList.toggle('active', deleteMode);
  document.body.classList.toggle('delete-mode', deleteMode);
}
document.getElementById('btnDeleteMode').addEventListener('click', ()=>{
  deleteMode = !deleteMode;
  if(deleteMode && dotMode){
    dotMode = false;
    const dotBtn = document.getElementById('btnDotMode');
    dotBtn.textContent = '● Modo punto: OFF';
    dotBtn.classList.remove('active');
  }
  updateDeleteModeBtn();
});

document.getElementById('btnToday').addEventListener('click', ()=>{
  const year = new Date().getFullYear();
  const todayKey = iso(new Date());
  const block = document.querySelector(`.year-block[data-year="${year}"]`);
  if(!block){ alert('El año actual no está en el historial todavía.'); return; }
  block.scrollIntoView({behavior:'smooth', block:'start'});
  const cell = block.querySelector(`.cell[data-date="${todayKey}"]`);
  if(cell){
    cell.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }
});

document.getElementById('btnClearAll').addEventListener('click', ()=>{
  const ok = confirm('¿Borrar TODO el historial de entrenamientos? Esta acción no se puede deshacer.');
  if(!ok) return;
  data = {};
  saveData();
  render();
});

document.getElementById('btnAddYear').addEventListener('click', ()=>{
  const y = prompt('Año a añadir (ej. 2027):');
  const n = parseInt(y,10);
  if(n && !years.includes(n)){
    years.push(n);
    saveYears();
    render();
  }
});

document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({data, years}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'workout-history-backup.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed.data){
        data = Object.assign({}, data, parsed.data);
        saveData();
      }
      if(parsed.years){
        parsed.years.forEach(y=>{ if(!years.includes(y)) years.push(y); });
        saveYears();
      }
      render();
    }catch(err){
      alert('Archivo no válido.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   MODAL (añadir/editar entrada manual)
   ============================================================ */
const modalBg = document.getElementById('modalBg');
document.getElementById('btnAdd').addEventListener('click', ()=>{
  document.getElementById('mDate').value = iso(new Date());
  document.getElementById('mLevel').value = '2';
  document.getElementById('mDot').checked = false;
  document.getElementById('mNote').value = '';
  modalBg.classList.add('open');
});
document.getElementById('mCancel').addEventListener('click', ()=>modalBg.classList.remove('open'));
document.getElementById('mSave').addEventListener('click', ()=>{
  const dateVal = document.getElementById('mDate').value;
  if(!dateVal) return;
  const level = parseInt(document.getElementById('mLevel').value,10);
  const dot = document.getElementById('mDot').checked;
  const note = document.getElementById('mNote').value.trim();
  const year = parseInt(dateVal.slice(0,4),10);
  if(!years.includes(year)){ years.push(year); saveYears(); }
  if(level===0 && !dot && !note){
    delete data[dateVal];
  } else {
    data[dateVal] = {level, dot, note};
  }
  saveData();
  modalBg.classList.remove('open');
  render();
});

/* ============================================================
   EXPORTAR COMO IMAGEN (alta calidad, todos los años apilados)
   ============================================================ */
const EXPORT_COLORS = {
  bgFrom:'#0a1830', bgTo:'#050810',
  panel:'#0a1120', panelBorder:'#152037',
  empty:'#101a2c', l1:'#0f3159', l2:'#155a94', l3:'#1c8ad6', l4:'#e0b94d',
  text:'#e9f1fb', muted:'#6e84a3', accent:'#2b8fe0', dot:'#f4f8ff', today:'#f4f8ff'
};

function buildExportYearBlock(year, cellPx, gapPx){
  const cols = buildYearGrid(year);
  const monthLabels = monthLabelsFor(cols, year);
  const todayKey = iso(new Date());

  let count = 0;
  Object.keys(data).forEach(k=>{
    if(k.startsWith(year+'-') && data[k].level>0) count++;
  });

  const block = document.createElement('div');
  block.style.background = EXPORT_COLORS.panel;
  block.style.border = '1px solid '+EXPORT_COLORS.panelBorder;
  block.style.borderRadius = '14px';
  block.style.padding = '22px 22px 18px';
  block.style.margin = '18px 0';

  const head = document.createElement('div');
  head.style.display='flex';
  head.style.justifyContent='space-between';
  head.style.alignItems='baseline';
  head.style.marginBottom='16px';
  head.innerHTML = `
    <span style="font-size:22px;font-weight:800;color:${EXPORT_COLORS.text};">${year}</span>
    <span style="font-size:14px;font-weight:600;color:${EXPORT_COLORS.muted};">${count} entrenamientos</span>
  `;
  block.appendChild(head);

  const row = document.createElement('div');
  row.style.display='flex';
  row.style.gap='9px';

  // etiquetas de día
  const dl = document.createElement('div');
  dl.style.display='grid';
  dl.style.gridTemplateRows = `18px repeat(7, ${cellPx}px)`;
  dl.style.rowGap = gapPx+'px';
  dl.style.fontSize='10px';
  dl.style.color = EXPORT_COLORS.muted;
  dl.appendChild(document.createElement('span'));
  CONFIG.dayLabels.forEach((lab,i)=>{
    const s = document.createElement('span');
    s.style.height = cellPx+'px';
    s.style.lineHeight = cellPx+'px';
    s.textContent = CONFIG.visibleDayLabels.includes(i) ? lab : '';
    dl.appendChild(s);
  });
  row.appendChild(dl);

  // rejilla
  const ga = document.createElement('div');
  ga.style.display='grid';
  ga.style.gridAutoFlow='column';
  ga.style.gridTemplateRows = `18px repeat(7, ${cellPx}px)`;
  ga.style.rowGap = gapPx+'px';
  ga.style.columnGap = gapPx+'px';
  ga.style.gridTemplateColumns = `repeat(${cols.length}, ${cellPx}px)`;

  cols.forEach((col,ci)=>{
    const ml = monthLabels.find(m=>m.col===ci);
    const label = document.createElement('div');
    label.style.gridColumn = ci+1;
    label.style.gridRow = 1;
    label.style.fontSize='11px';
    label.style.color = EXPORT_COLORS.muted;
    label.style.alignSelf='end';
    label.style.whiteSpace='nowrap';
    label.textContent = ml ? ml.text : '';
    ga.appendChild(label);

    col.forEach((d,ri)=>{
      const cell = document.createElement('div');
      cell.style.gridColumn = ci+1;
      cell.style.gridRow = ri+2;
      cell.style.width = cellPx+'px';
      cell.style.height = cellPx+'px';
      cell.style.borderRadius='3px';
      cell.style.position='relative';
      const inYear = d.getFullYear()===year;
      if(!inYear){
        cell.style.background='transparent';
      } else {
        const key = iso(d);
        const entry = data[key];
        const level = entry ? entry.level : 0;
        const colorMap = [EXPORT_COLORS.empty, EXPORT_COLORS.l1, EXPORT_COLORS.l2, EXPORT_COLORS.l3, EXPORT_COLORS.l4];
        cell.style.background = colorMap[level];
        if(key === todayKey){
          cell.style.boxShadow = 'inset 0 0 0 1px '+EXPORT_COLORS.today;
        }
        if(entry && entry.dot){
          const dot = document.createElement('div');
          dot.style.position='absolute';
          dot.style.top='50%';
          dot.style.left='50%';
          dot.style.width='4px';
          dot.style.height='4px';
          dot.style.borderRadius='50%';
          dot.style.background = EXPORT_COLORS.dot;
          dot.style.transform='translate(-50%,-50%)';
          cell.appendChild(dot);
        }
      }
      ga.appendChild(cell);
    });
  });
  row.appendChild(ga);
  block.appendChild(row);

  // leyenda
  const legend = document.createElement('div');
  legend.style.display='flex';
  legend.style.alignItems='center';
  legend.style.gap='6px';
  legend.style.fontSize='11px';
  legend.style.color = EXPORT_COLORS.muted;
  legend.style.marginTop='14px';
  legend.style.justifyContent='flex-end';
  const sw = (c)=>`<span style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block;"></span>`;
  legend.innerHTML = `<span>Menos</span>${sw(EXPORT_COLORS.empty)}${sw(EXPORT_COLORS.l1)}${sw(EXPORT_COLORS.l2)}${sw(EXPORT_COLORS.l3)}${sw(EXPORT_COLORS.l4)}<span>Más</span>`;
  block.appendChild(legend);

  return block;
}

function loadHtml2Canvas(){
  return new Promise((resolve,reject)=>{
    if(window.html2canvas){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('No se pudo cargar la librería de exportación.'));
    document.head.appendChild(s);
  });
}

async function exportAsImage(){
  const btn = document.getElementById('btnExportImg');
  const originalText = btn.textContent;
  btn.textContent = 'Generando...';
  btn.disabled = true;
  try{
    await loadHtml2Canvas();

    const cellPx = 13;
    const gapPx = 4;

    const wrap = document.createElement('div');
    wrap.style.position='fixed';
    wrap.style.left='-99999px';
    wrap.style.top='0';
    wrap.style.width='fit-content';
    wrap.style.background = `linear-gradient(180deg, ${EXPORT_COLORS.bgFrom} 0%, ${EXPORT_COLORS.bgTo} 55%)`;
    wrap.style.padding='44px 34px';
    wrap.style.fontFamily = getComputedStyle(document.body).fontFamily;

    const title = document.createElement('div');
    title.style.textAlign='center';
    title.style.marginBottom='26px';
    title.innerHTML = `<div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;color:${EXPORT_COLORS.text};">Historial de <span style="color:${EXPORT_COLORS.accent};font-weight:900;">Entrenamientos</span></div>`;
    wrap.appendChild(title);

    // todos los años desde CONFIG.startYear hasta el año actual real, más los añadidos manualmente
    const currentYear = new Date().getFullYear();
    const fullYears = new Set(years);
    for(let y=CONFIG.startYear; y<=currentYear; y++) fullYears.add(y);
    const orderedYears = Array.from(fullYears).sort((a,b)=>b-a);

    orderedYears.forEach(year=>{
      wrap.appendChild(buildExportYearBlock(year, cellPx, gapPx));
    });

    document.body.appendChild(wrap);

    const canvas = await html2canvas(wrap, {
      scale: 3,
      backgroundColor: EXPORT_COLORS.bgTo,
      useCORS: true
    });

    document.body.removeChild(wrap);

    canvas.toBlob((blob)=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'historial-entrenamientos.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');

  }catch(err){
    alert('No se pudo generar la imagen: '+err.message);
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

document.getElementById('btnExportImg').addEventListener('click', exportAsImage);

/* ============================================================
   INIT
   ============================================================ */
render();
</script>
